# Локальные хуки повторяют то, что уже гоняет autofix.yml и quality.yml:
# ruff (статические ошибки) + black + isort (формат и порядок импортов).
# rev-теги совпадают с версиями, зафиксированными в CI
# (autofix.yml: ruff==0.4.10 black==24.4.2 isort==5.13.2), чтобы хук
# и CI не спорили о формате одного и того же файла.
#
# Гигиена: стандартные pre-commit-hooks + gitleaks (сканер секретов,
# включая приватные ключи) — чтобы токены не попадали в git.
#
# Исключения:
# - .github/release.yml: GitHub-специфичный flow-синтаксис [dependabot[bot]]
#   валиден для GitHub, но не для строгого YAML-парсера check-yaml;
# - archive/: legacy-артефакты, намеренно не трогаем.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [--fix, --select, "E9,F63,F7,F82"]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.4.2
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^archive/
      - id: trailing-whitespace
        exclude: ^archive/
      - id: check-yaml
        exclude: ^\.github/release\.yml$
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-added-large-files
        args: [--maxkb=1024]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
