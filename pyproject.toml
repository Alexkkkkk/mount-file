#
# Конфигурация python-semantic-release v9 для проекта mount-file.
# Каноническая версия хранится синхронно в mountfile/__init__.py и
# [project].version и обновляется единым релизным процессом.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mountfile"
version = "1.58.0"
description = "GUI-инструмент для работы с raw-образами NAND/eMMC/дисков"
readme = "README.md"
dependencies = [
    "PyQt6>=6.11.0",
]

requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexkkkkk" }]
keywords = ["forensics", "dfir", "disk-image", "nand", "emmc", "fat32", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Filesystems",
]

[project.urls]
Homepage = "https://github.com/Alexkkkkk/mount-file"
Documentation = "https://alexkkkkk.github.io/mount-file/"
Changelog = "https://github.com/Alexkkkkk/mount-file/blob/main/CHANGELOG.md"
Issues = "https://github.com/Alexkkkkk/mount-file/issues"


[project.optional-dependencies]
legacy-tsk = [
    "pytsk3>=20260715",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "hypothesis>=6",
    "pydantic>=2.0",
    "ruff>=0.4",
    "black>=24.4",
    "isort>=5.13",
    "pyinstaller>=6.22.3",
]
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
]
dfir = [
    "python-dateutil>=2.8.2",
    "yara-python>=4.5.0; platform_system!='Windows' or python_version>='3.10'",
]
ai = [
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0",
    "openai>=1.0",
    "regex>=2024.0.0",
]
rw = [
    "pytsk3>=20260715",   # legacy RO fallback через MountFileBridge
]
rw-ext = [
    "mountfile[rw]",
    # debugfs — системный пакет e2fsprogs, ставится отдельно
]
rw-ntfs = [
    "mountfile[rw]",
    # ntfs-3g — системный пакет, ставится отдельно
]
fuzz = [
    "atheris>=2.3; sys_platform == 'linux'",
]

[project.scripts]
mountfile = "mountfile.__main__:main"
mountfile-ai = "mountfile_ai:main"
mountfile-rw = "mountfile_rw_complete:main"
mountfile-rw-v2 = "mountfile_rw_v2:main"

[tool.setuptools]
# Top-level RW modules are referenced by [project.scripts] below; without
# py-modules setuptools ships only the ``mountfile`` package and the
# ``mountfile-rw`` / ``mountfile-rw-v2`` entry points never get installed.
py-modules = [
    "mountfile_ai",
    "mountfile_universal_rw",
    "mountfile_rw_complete",
    "mountfile_rw_v2",
]

[tool.setuptools.packages.find]
include = ["mountfile*"]

[tool.setuptools.package-data]
mountfile = ["data/*.bin", "data/*.png", "data/*.ico", "data/*.icns", "data/*.ps1"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.semantic_release]
# v9 обновляет обе канонические версии одним релизным коммитом: Python-
# переменную пакета и TOML-ключ [project].version. Второго pipeline нет.
version_variables = ["mountfile/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v{version}"
# [skip ci] обязателен: иначе коммит semantic-release сам запускает
# Auto Release и получается бесконечный цикл.
commit_message = "chore(release): {version} [skip ci]"

[tool.semantic_release.branches.main]
# v9: ветки описываются таблицей branches, ключ branch — legacy.
match = "main"
prerelease = false

[tool.semantic_release.changelog]
# mode = "update" дописывает новый раздел в существующий CHANGELOG.md,
# а не перезаписывает его целиком.
changelog_file = "CHANGELOG.md"
mode = "update"

[tool.ruff.lint.per-file-ignores]
# Re-export layer: these imports *are* the public API of the module.
# ruff --fix (autofix workflow) must never strip them again - the
# OLMA rewrite did exactly that and broke every GUI import in CI.
"mountfile/qt_compat.py" = ["F401"]

[tool.black]
# Совпадает с rev в .pre-commit-config.yaml и с версией в CI.
target-version = ["py310", "py311", "py312"]

[tool.isort]
# black-профиль исключает конфликт двух форматтеров (isort vs black):
# без него isort перезаписывает то, что отформатировал black.
profile = "black"
line_length = 88
