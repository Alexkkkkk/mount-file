[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mount-file"
version = "0.1.0"
description = "Файловый менеджер поверх образов: MBR/GPT, pytsk3-чтение, запись в FAT, hex-просмотр"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alexkkkkk", url = "https://github.com/Alexkkkkk" }]
keywords = ["disk image", "forensics", "fat32", "mbr", "gpt", "pytsk3", "hex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

# Core has NO hard dependencies on purpose: MBR/GPT parsing, sniffing, hex view
# and transactional patching are pure Python and work on a bare interpreter.
dependencies = []

[project.optional-dependencies]
# read access to FAT/NTFS/ext2-4/exFAT/ISO9660 inside images
read = ["pytsk3>=4.12"]
# GUI (PyQt6 preferred; PySide6 also accepted by the code)
gui = ["PyQt6>=6.5"]
dev = ["pytest>=7.4", "pytsk3>=4.12"]

[project.scripts]
mfim = "mfim.cli:main"

[project.gui-scripts]
mfim-gui = "mfim.gui.app:main"

[tool.setuptools.packages.find]
include = ["mfim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
