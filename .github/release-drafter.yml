name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'
categories:
  - title: '🚀 Features'
    labels: ['enhancement', 'feature', 'ai', 'dfir']
  - title: '🐛 Bug Fixes'
    labels: ['bug', 'fix', 'ci-failure']
  - title: '🧰 Maintenance / CI'
    labels: ['ci', 'automation', 'dependencies', 'infrastructure']
  - title: '📚 Documentation'
    labels: ['documentation', 'docs']
change-template: '- #$NUMBER: $TITLE (@$AUTHOR)'
sort-by: title
sort-direction: ascending
template: |
  ## Что нового
  $CHANGES
