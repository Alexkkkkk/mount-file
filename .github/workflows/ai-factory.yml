name: AI Factory (Zero-Touch + Agentic)

on:
  push:
    branches: [main]
  issues:
    types: [opened, labeled]
  pull_request:
    types: [labeled, closed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # КОНТУР 1: AGENTIC WORKFLOW — AI-агент анализирует Issues и CI
  # ============================================================
  agentic-triage:
    if: >
      github.event_name == 'issues' && github.event.action == 'opened' ||
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gh-aw
        run: |
          gh extension install github/gh-aw
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Agentic Triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          gh aw run triage \
            --repo "${{ github.repository }}" \
            --event "${{ github.event_name }}" \
            --max-tokens 4000

  # ============================================================
  # КОНТУР 2: SELF-HEALING — мультиагентное исправление багов
  # ============================================================
  self-heal:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout failing ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install self-healing-cicd
        run: pip install self-healing-cicd

      - name: Run multi-agent healer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_RUN_ID: ${{ github.event.workflow_run.id }}
          AUTO_APPROVE_PATCHES: "true"
          GIT_ENABLED: "true"
          REQUIRE_APPROVAL: "false"
          EXCLUDED_WORKFLOW_NAMES: "AI Factory (Zero-Touch + Agentic)"
          ALLOWED_PATH_PREFIXES: "src/,app/,lib/,tests/"
          LOG_PARSER_LANGUAGE: "python"
        run: |
          python -m self_healing_cicd \
            --run-id "$GITHUB_RUN_ID" \
            --repo "${{ github.repository }}"

  # ============================================================
  # КОНТУР 3: AI-REVIEW + AUTO-MERGE
  # ============================================================
  ai-review-and-merge:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'automerge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: AI Review with risk score
        uses: misospace/pr-reviewer-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allow_approve: true
          model: "claude-sonnet-4-20250514"

      - name: Auto-merge if approved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if gh pr view "$PR_URL" --json reviewDecision -q '.reviewDecision' | grep -q "APPROVED"; then
            gh pr merge --auto --squash --delete-branch "$PR_URL"
          else
            echo "AI не одобрил PR — требуется ручное ревью"
          fi

  # ============================================================
  # КОНТУР 4: SUPPLY CHAIN SECURITY — SLSA L3 + секреты
  # ============================================================
  supply-chain-security:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — сканирование секретов
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SBOM generation (Syft)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  # ============================================================
  # КОНТУР 5: OBSERVABILITY — OpenTelemetry трассировка
  # ============================================================
  observability:
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Export traces to OpenTelemetry
        uses: base14/scout-action@v1
        with:
          otlp_endpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          otlp_headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          service_name: "${{ github.repository }}/${{ github.workflow }}"

  # ============================================================
  # КОНТУР 6: CLEANUP + ARTIFACTS
  # ============================================================
  cleanup:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Delete merged branch
        if: github.event.pull_request.merged == true
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const protectedBranches = ['main', 'master', 'develop', 'development'];
            const protectedPatterns = [/^release\//, /^hotfix\//, /^copilot\//];
            if (protectedBranches.includes(branch) || protectedPatterns.some(p => p.test(branch))) {
              console.log(`Ветка "${branch}" защищена, пропускаем.`);
              return;
            }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              console.log(`Ветка "${branch}" удалена.`);
            } catch (error) {
              console.error(`Ошибка удаления: ${error.message}`);
            }

      - name: Purge old artifacts
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000);
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            for (const art of artifacts) {
              if (new Date(art.created_at) < cutoff) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: art.id,
                });
                console.log(`Удалён артефакт: ${art.name}`);
              }
            }
