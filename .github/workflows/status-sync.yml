name: Sync repository status data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-status-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Generate canonical status data
        run: |
          python scripts/sync_repository_status.py --output-dir docs/generated
          python scripts/generate_readme.py --revision "${GITHUB_REF_NAME}"

      - name: Commit synchronized data
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md docs/generated; then
            echo 'Repository status data is already synchronized.'
            exit 0
          fi
          git config user.name 'mount-file status bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/generated
          git commit -m 'docs: synchronize repository status data [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
