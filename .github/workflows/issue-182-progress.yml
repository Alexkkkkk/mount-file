name: Issue 182 progress sync

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate committed issue progress (read-only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_PROGRESS: "false"
        run: python3 scripts/sync_issue_182_progress.py

  publish-main-progress:
    if: github.ref == 'refs/heads/main'
    needs: validate-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Serialize publishers without preventing independent read-only validation.
    concurrency:
      group: issue-182-progress-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      # This job alone has write permission, and executes script code only from
      # the trusted default branch, never from an arbitrary pushed ref.
      - name: Check out trusted main branch code and status
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Record checked out trusted main SHA
        id: main-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish only if this remains current main head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKED_OUT_SHA: ${{ steps.main-sha.outputs.sha }}
          PUBLISH_PROGRESS: "true"
        run: python3 scripts/sync_issue_182_progress.py
