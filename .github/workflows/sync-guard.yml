# .github/workflows/sync-guard.yml
#
# Guards the repository against the two failures that silently break a release:
#   1. the version in pyproject.toml and mountfile/__init__.py diverged
#      (Auto Release then tags a version the package does not report);
#   2. a credential was committed into a tracked file.
#
# Both checks run `tools/mfsync.py` with the interpreter only - no third-party
# packages, no network calls, no repository secrets beyond the default token.
name: Sync Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Version parity + secret scan
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `git describe --tags` needs the tags

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Must run before the strict gate: a leaked credential is the more
      # urgent failure and the exit code 4 tells them apart (4 = secrets).
      - name: Scan tracked files for credentials
        run: python tools/mfsync.py scan --all

      - name: Check version parity (pyproject.toml vs mountfile/__init__.py)
        run: python tools/mfsync.py check --strict

      - name: Sync status report
        run: python tools/mfsync.py status --json

  tests:
    name: Sync helper tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run tools/mfsync.py tests
        run: python -m pytest tests/test_mfsync.py -v
