# SPDX-License-Identifier: MIT
# Manual Windows build: MountFile.exe via PyInstaller (one-file, windowed).
name: build-windows-exe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.22.3"

      - name: Import smoke test
        run: python -c "from PyQt6 import QtCore, QtGui, QtWidgets; import mountfile"

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name MountFile --hidden-import mountfile_dfir_tools
          --collect-data mountfile main.py

      - name: Verify exe exists and is non-empty
        shell: pwsh
        run: |
          if (!(Test-Path dist/MountFile.exe)) { throw "MountFile.exe missing" }
          if ((Get-Item dist/MountFile.exe).Length -eq 0) { throw "MountFile.exe is empty" }
          Write-Host "OK: dist/MountFile.exe $((Get-Item dist/MountFile.exe).Length) bytes"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MountFile-exe
          path: dist/MountFile.exe
          if-no-files-found: error
