name: release

# Automatic release:
#   * push a tag like "v0.2.0"  ->  build MountFile.exe + GitHub Release;
#   * or run manually from the Actions tab (workflow_dispatch).
#
# The exe is built on Python 3.8 with PyQt5 (requirements-win7.txt), so
# the same binary runs on Windows 7, 10 and 11.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies (Win7-compatible set) + PyInstaller
        run: |
          pip install -r requirements-win7.txt
          pip install pyinstaller

      - name: Run the test suite before releasing
        run: |
          pip install pytest
          python -m pytest tests/ -v

      - name: Build MountFile.exe
        run: |
          python -m PyInstaller --onefile --windowed --name MountFile `
            --collect-submodules pytsk3 main.py

      - name: Smoke-test the executable
        run: dist\MountFile.exe --diag

      - name: Create GitHub Release with the exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MountFile.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
