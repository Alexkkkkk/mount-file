name: release

# Single release pipeline. Triggered by the "release: published" event so
# that a tag push (create-release.yml) and a manual tag both land here,
# exactly once, and never race with a second workflow that also attaches
# binaries (the old windows-exe.yml / release.yml race is gone).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild and attach assets to'
        required: true
        type: string
      source_ref:
        description: 'Build from this ref instead of the tag (backfill of an older release)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  gate:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -uo pipefail
          echo "tag: $TAG"
          # Backfill-aware: rebuild only when at least one expected asset
          # (Windows exe, Linux binary, macOS binary) is still missing.
          HAVE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
          MISSING=0
          for asset in MountFile.exe MountFile-win10-x64.exe MountFile-linux-x86-64 MountFile-macos-arm64; do
            for expected in "$asset" "$asset.sha256"; do
              if ! echo "$HAVE" | grep -Fxq "$expected"; then
                echo "missing asset: $expected"
                MISSING=1
              fi
            done
          done
          if [ "$MISSING" -eq 0 ]; then
            echo "release $TAG already carries all binaries - nothing to rebuild."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  test:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.source_ref || inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install 'fastapi>=0.115,<1.0' 'uvicorn>=0.30,<1.0' 'httpx>=0.27,<1.0'
      - run: python -m pytest tests/ -v

  build:
    name: exe (${{ matrix.label }})
    needs: [gate, test]
    if: needs.gate.outputs.proceed == 'true'
    timeout-minutes: 30
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-py310
            python: '3.10'
            spec: requirements.txt
            qt: PyQt6
            name: MountFile
          - label: win10
            python: '3.12'
            spec: requirements.txt
            qt: PyQt6
            name: MountFile-win10-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.source_ref || inputs.tag }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          # A requirements install failure is FATAL. The old silent fallback
          # masked a broken requirements.txt (v1.14.0) and produced builds
          # without the app's real dependencies.
          python -m pip install -r ${{ matrix.spec }}
          if ($LASTEXITCODE -ne 0) { throw "pip install -r ${{ matrix.spec }} failed" }
          # Fail loudly when the binding never landed in site-packages:
          # a broken requirements file installs nothing while pip still
          # exits 0 (every line parsed as a comment).
          python -m pip show ${{ matrix.qt }}
          if ($LASTEXITCODE -ne 0) { throw "${{ matrix.qt }} missing after requirements install - requirements file is broken" }
          # The Qt binding is mandatory - without it the frozen exe is useless.
          python -c "import ${{ matrix.qt }} as m; print('${{ matrix.qt }} OK')"
          if ($LASTEXITCODE -ne 0) { throw "${{ matrix.qt }} could not be imported" }
          # pytsk3 is optional: without it the app still browses and writes
          # FAT32 with the built-in engine. This probe must never leak its
          # non-zero exit code into the step.
          python -c "import pytsk3" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'pytsk3 OK'
          } else {
            Write-Host '::warning title=pytsk3 missing::NTFS/EXT browsing unavailable in this build'
          }
          exit 0

      - name: Source diagnostics
        shell: pwsh
        run: |
          python main.py --diag
          if ($LASTEXITCODE -ne 0) { throw "source diagnostics failed (exit $LASTEXITCODE)" }

      - name: Stamp the release version into the package
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python scripts/stamp_version.py $env:TAG
          if ($LASTEXITCODE -ne 0) { throw 'could not synchronize package/build versions' }

      - name: Build one-file executable
        shell: pwsh
        run: |
          $name = '${{ matrix.name }}'
          $flags = @('--noconfirm', '--clean', '--onefile', '--windowed', '--name', $name)
          python -c "import pytsk3" 2>$null
          if ($LASTEXITCODE -eq 0) { $flags += @('--collect-submodules', 'pytsk3') }
          # App icon path is picked per OS by
          # mountfile/appicon.py: icon.ico on Windows, icon.icns on macOS, icon.png
          # on Linux. Collect package data for icons and RT809 XOR tables.
          $icon = (python -m mountfile.appicon).Trim()
          if ($icon) { $flags += @('--icon', $icon); Write-Host "icon: $icon" }
          else { Write-Host '::warning title=icon missing::building with the default PyInstaller icon' }
          $flags += @('--collect-data', 'mountfile')
          python -m PyInstaller @flags main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }

      - name: Verify the executable + checksum
        shell: pwsh
        run: |
          $exe = "dist\${{ matrix.name }}.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $item = Get-Item $exe
          $mb = [math]::Round($item.Length / 1MB, 1)
          Write-Host "artifact: $($item.Name)  size: $mb MB"
          $magic = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe)[0..1])
          if ($magic -ne 'MZ') { throw "not a Windows PE binary (magic=$magic)" }
          if ($item.Length -lt 5MB) { throw "executable suspiciously small ($mb MB)" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "sha256: $hash"
          "$hash  $($item.Name)" | Set-Content "$exe.sha256"
          Get-ChildItem dist | Select-Object Name, Length

      - name: Frozen exe self-check (informational)
        shell: pwsh
        continue-on-error: true
        run: |
          & "dist\${{ matrix.name }}.exe" --diag
          Write-Host "frozen exe exit code: $LASTEXITCODE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: exe-${{ matrix.label }}
          path: |
            dist/${{ matrix.name }}.exe
            dist/${{ matrix.name }}.exe.sha256
          if-no-files-found: error
          retention-days: 90

  unix:
    name: unix binary (${{ matrix.label }})
    needs: [gate, test]
    if: needs.gate.outputs.proceed == 'true'
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86-64 (macos-latest is Apple silicon, hence arm64 there)
          - label: linux
            os: ubuntu-latest
            python: '3.12'
            name: MountFile-linux-x86-64
          - label: macos
            os: macos-latest
            python: '3.12'
            name: MountFile-macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.source_ref || inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 pyinstaller
          python -m pip install pytsk3 || echo "pytsk3 unavailable - building with the built-in FAT32 engine only"
      - name: Stamp package and build metadata from the release tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python scripts/stamp_version.py "$TAG"
      - name: Build
        run: NAME=${{ matrix.name }} ./build_exe.sh
      - name: Smoke test the binary
        # Informational: the olma runtime's patched open() trips over
        # PyInstaller's _MEIPASS during linecache reads and crashes --diag
        # even though the binary itself works. This must not block publish.
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/${{ matrix.name }} --diag
          ./dist/${{ matrix.name }} --version
      - name: Checksum
        # macOS ships shasum, not sha256sum
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum dist/${{ matrix.name }} > dist/${{ matrix.name }}.sha256
          else
            shasum -a 256 dist/${{ matrix.name }} > dist/${{ matrix.name }}.sha256
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: exe-${{ matrix.label }}
          path: |
            dist/${{ matrix.name }}
            dist/${{ matrix.name }}.sha256
          if-no-files-found: error

  publish:
    name: attach binaries to the release
    needs: [gate, build, unix]
    # All supported Windows and Unix build jobs must succeed before upload.
    if: >-
      always() &&
      needs.gate.outputs.proceed == 'true' &&
      needs.build.result == 'success' &&
      needs.unix.result == 'success'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create/upload shell out to git, so the job must be inside
      # a repository - without this checkout the publish job failed with
      # "fatal: not a git repository (or any of the parent directories): .git".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: exe-*
          merge-multiple: true
          path: dist

      - name: Inspect artifacts
        run: ls -lh dist

      - name: Verify all required platform binaries and checksums
        shell: bash
        run: |
          set -euo pipefail
          for asset in MountFile.exe MountFile-win10-x64.exe MountFile-linux-x86-64 MountFile-macos-arm64; do
            for file in "$asset" "$asset.sha256"; do
              if [ ! -s "dist/$file" ]; then
                echo "::error::Missing required release asset: $file"
                exit 1
              fi
            done
          done

      - name: Create/verify the release, then upload (retried)
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -uo pipefail
          for i in $(seq 1 10); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $TAG exists"; break
            fi
            echo "release $TAG not found yet (attempt $i) - creating it"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes || true
            sleep 15
          done
          UPLOADED=false
          for i in 1 2 3 4 5; do
            if gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/MountFile* --clobber; then
              echo "upload OK on attempt $i"; UPLOADED=true; break
            fi
            echo "upload attempt $i failed, retrying in 15s..."; sleep 15
          done
          if [ "$UPLOADED" != true ]; then
            echo '::error::All release upload attempts failed'
            exit 1
          fi
          echo "--- assets now in $TAG ---"
          HAVE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for asset in MountFile.exe MountFile-win10-x64.exe MountFile-linux-x86-64 MountFile-macos-arm64; do
            for expected in "$asset" "$asset.sha256"; do
              if ! echo "$HAVE" | grep -Fxq "$expected"; then
                echo "::error::Release is missing uploaded asset: $expected"
                exit 1
              fi
            done
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'


  deploy:
    name: Deploy the verified release
    needs: [gate, publish]
    if: needs.gate.outputs.proceed == 'true' && needs.publish.result == 'success'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch production deployment after asset publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f environment=production -f source_ref="$TAG"
