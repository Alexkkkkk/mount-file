name: CI Healer v3

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: ci-healer-v3-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  heal:
    if: >
      vars.ENABLE_CI_HEALER_V3 == 'true' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout failing commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9cae0 # v7
        with:
          python-version: '3.12'

      - name: Install agent deps
        run: pip install -r tools/ci-healer-v3/requirements.txt

      - name: Determine failed job name
        id: job
        run: |
          gh run view ${{ github.event.workflow_run.id }} --json jobs \
            --jq '.jobs[] | select(.conclusion=="failure") | .name' \
            | head -1 > failed_job.txt
          echo "name=$(cat failed_job.txt)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI Healer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_ENDPOINT }}
        run: |
          python tools/ci-healer-v3/ci_healer_v3.py \
            --run-id "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            --job-name "${{ steps.job.outputs.name }}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: ci-healer-diagnostics
          path: |
            .ci_healer_cache.json
            coverage.json
            .ci_healer_patch.diff
