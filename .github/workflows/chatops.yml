name: chatops
# Exact commands from owners/members/collaborators only. Operates on main,
# never on code from the PR where the comment was written.
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: chatops-${{ github.event.comment.id }}
  cancel-in-progress: false
jobs:
  parse:
    if: >-
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      cmd: ${{ steps.command.outputs.cmd }}
    steps:
      - id: command
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          case "$BODY" in
            /release) echo 'cmd=release' >> "$GITHUB_OUTPUT" ;;
            /autofix) echo 'cmd=autofix' >> "$GITHUB_OUTPUT" ;;
            /sync) echo 'cmd=sync' >> "$GITHUB_OUTPUT" ;;
            *) echo 'No exact supported command.' ;;
          esac
  dispatch:
    needs: parse
    if: needs.parse.outputs.cmd != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMMAND: ${{ needs.parse.outputs.cmd }}
    steps:
      - name: Start the native workflow on main
        run: |
          set -euo pipefail
          case "$COMMAND" in
            release) gh workflow run version-bump.yml --repo "$GITHUB_REPOSITORY" --ref main -f patch=true ;;
            autofix) gh workflow run autofix.yml --repo "$GITHUB_REPOSITORY" --ref main ;;
            sync) gh workflow run mfsync.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=verify ;;
          esac
