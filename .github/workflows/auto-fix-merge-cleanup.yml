# .github/workflows/auto-fix-merge-cleanup.yml
#
# Три независимых джоба в одном файле:
#   1. auto-fix       — self-healing патч при падении CI (workflow_run)
#   2. auto-merge     — squash-merge PR с меткой automerge / auto-merge
#   3. cleanup-branch — удаление ветки после слияния PR
#
# Требуемые секреты: OPENAI_API_KEY, опционально AUTOMATION_TOKEN.
name: Auto Fix, Merge & Cleanup (Zero-Touch)

on:
  workflow_run:
    # Должно совпадать с полем name в .github/workflows/ci.yml — там "CI".
    workflows: ["CI"]
    types: [completed]
  pull_request:
    # labeled нужен для джоба auto-merge: раньше триггер содержал только
    # closed, поэтому условие на github.event.action == 'labeled' было
    # недостижимо и авто-слияние не запускалось никогда.
    types: [closed, labeled]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: zero-touch-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # JOB 1: Auto-Fix — исправление багов при падении CI
  # ============================================================
  auto-fix:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout failing ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install self-healing-cicd
        run: |
          python -m pip install --upgrade pip
          pip install self-healing-cicd

      - name: Run self-healing agent
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_RUN_ID: ${{ github.event.workflow_run.id }}
          AUTO_APPROVE_PATCHES: "true"
          GIT_ENABLED: "true"
          EXCLUDED_WORKFLOW_NAMES: "Auto Fix, Merge & Cleanup (Zero-Touch)"
        run: |
          python -m self_healing_cicd \
            --run-id "$GITHUB_RUN_ID" \
            --repo "${{ github.repository }}"

  # ============================================================
  # JOB 2: Auto-Merge — авто-слияние PR с меткой
  # ============================================================
  auto-merge:
    # В репозитории метка называется "auto-merge" (см. autofix.yml),
    # поэтому принимаем оба написания.
    if: >-
      ${{ github.event_name == 'pull_request'
          && github.event.action == 'labeled'
          && (github.event.label.name == 'automerge'
              || github.event.label.name == 'auto-merge') }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # --auto: слияние произойдёт на стороне GitHub, как только
          # обязательные проверки ruleset станут зелёными.
          gh pr merge --auto --squash --delete-branch "$PR_URL"

  # ============================================================
  # JOB 3: Auto-Cleanup — удаление ветки после слияния PR
  # ============================================================
  cleanup-branch:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const protectedBranches = ['main', 'master', 'develop', 'development'];
            if (protectedBranches.includes(branch)) {
              console.log(`Ветка "${branch}" защищена, пропускаем.`);
              return;
            }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              console.log(`Ветка "${branch}" успешно удалена.`);
            } catch (error) {
              console.error(`Ошибка удаления ветки "${branch}":`, error.message);
            }
