name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      source_ref:
        description: Stable release tag required for production; ignored by staging
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Sanity build (byte-compile)
        run: python -m compileall -q mountfile main.py tests
      - name: Package source bundle
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
        run: |
          set -euo pipefail
          STAMP="${SOURCE_REF//\//-}-${GITHUB_SHA::7}"
          mkdir -p dist
          git archive --format=zip --prefix="MountFile-${STAMP}/" -o "dist/MountFile-${STAMP}.zip" HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mountfile-bundle
          path: dist/*.zip
          retention-days: 30
          if-no-files-found: error

  staging:
    needs: build
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mountfile-bundle
          path: dist
      - name: Publish to staging
        env:
          HOOK: ${{ secrets.DEPLOY_STAGING_COMMAND }}
        run: |
          set -euo pipefail
          echo "staging deploy of $GITHUB_SHA"
          ls -lh dist
          if [ -n "$HOOK" ]; then
            echo 'running custom staging hook'
            bash -c "$HOOK"
          else
            echo 'no DEPLOY_STAGING_COMMAND secret - build artifact published for this run'
          fi

  production:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases
    steps:
      - name: Require a stable release tag
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mountfile-bundle
          path: dist
      - name: Publish to production
        env:
          HOOK: ${{ secrets.DEPLOY_PRODUCTION_COMMAND }}
        run: |
          set -euo pipefail
          ls -lh dist
          if [ -n "$HOOK" ]; then
            bash -c "$HOOK"
          else
            echo 'no DEPLOY_PRODUCTION_COMMAND secret - verified release bundle retained as an artifact'
          fi
