name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Sanity build (byte-compile)
        run: python -m compileall -q mountfile main.py tests
      - name: Package source bundle
        run: |
          STAMP="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          mkdir -p dist
          git archive --format=zip --prefix="MountFile-${STAMP}/" -o "dist/MountFile-${STAMP}.zip" HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: mountfile-bundle
          path: dist/*.zip
          retention-days: 30

  staging:
    needs: build
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mountfile-bundle
          path: dist
      - name: Publish to staging
        env:
          HOOK: ${{ secrets.DEPLOY_STAGING_COMMAND }}
        run: |
          echo "staging deploy of $GITHUB_SHA"
          ls -lh dist
          if [ -n "$HOOK" ]; then echo "running custom staging hook"; bash -c "$HOOK"; else echo "no DEPLOY_STAGING_COMMAND secret - build artifact published for this run"; fi

  production:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mountfile-bundle
          path: dist
      - name: Publish to production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOOK: ${{ secrets.DEPLOY_PRODUCTION_COMMAND }}
        run: |
          set -e
          ls -lh dist
          if [ -n "$HOOK" ]; then bash -c "$HOOK"; fi
          case "$GITHUB_REF" in
            refs/tags/*)
              TAG="$GITHUB_REF_NAME"
              if gh release view "$TAG" >/dev/null 2>&1; then
                gh release upload "$TAG" dist/*.zip --clobber
              else
                gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes --verify-tag
              fi ;;
            *) echo "manual production run - no tag, skipping release publication" ;;
          esac
