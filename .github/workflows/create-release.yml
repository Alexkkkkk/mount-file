name: create-release

# Turns a tag into a GitHub Release with a categorized changelog, then
# starts the build stage with `gh workflow run` (workflow_dispatch).
# Both triggers are supported:
#   * push of a v* tag (e.g. a tag pushed by hand),
#   * workflow_dispatch with an explicit tag (how version-bump calls it).
# Release notes are generated here, so the repository has exactly one
# version calculator (version-bump) and no competing draft-release bot.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create the release for'
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: create-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create the GitHub Release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists - rebuilding the notes only."
            exit 0
          fi
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
          echo "commit range: $RANGE"
          NOTES=notes.md
          printf '### What changed in %s\n\n' "$TAG" > "$NOTES"
          add_section() {
            title="$1"; pat="$2"
            items=$(git log --no-merges --pretty=format:'- %s (`%h`)' "$RANGE" | grep -E "^- ($pat)" || true)
            if [ -n "$items" ]; then printf '#### %s\n%s\n\n' "$title" "$items" >> "$NOTES"; fi
          }
          add_section "Features" "feat"
          add_section "Fixes" "fix|perf"
          add_section "Maintenance" "chore|ci|build|refactor|docs|test|style"
          add_section "Other" "revert"
          printf '**Full diff**: https://github.com/%s/compare/%s...%s\n' \
            "$GITHUB_REPOSITORY" "${PREV:-$TAG}" "$TAG" >> "$NOTES"
          cat "$NOTES"
          gh release create "$TAG" --title "$TAG" --verify-tag --notes-file "$NOTES"
          echo "release $TAG created"

      - name: Start the build stage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
          echo "dispatched release for $TAG"
