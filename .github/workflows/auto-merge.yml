name: auto-merge

# Automatic merging of pull requests:
#   * dependabot PRs are approved and merged automatically;
#   * any PR labeled "auto-merge" is merged automatically.
# Merge method: squash; the head branch is deleted automatically.
#
# The PR is merged only after the "tests" checks of CI succeed
# (wait-on-check polls the Checks API). CI names those checks
# "Tests (<os>, py<x.y>)", so they are matched by regexp.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.state == 'open' &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       contains(github.event.pull_request.labels.*.name, 'auto-merge'))
    steps:
      - name: Wait for CI tests to pass
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-regexp: '^Tests '
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          timeout-minutes: 30

      - name: Approve dependabot PR
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Squash merge and delete the branch
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
