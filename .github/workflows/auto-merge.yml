name: auto-merge
# Explicit opt-in label, trusted same-repository author, successful gates.
# No blanket approval and no bypass of branch protection.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
permissions:
  contents: read
concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  auto-merge:
    if: >-
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge') &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       github.event.pull_request.user.login == 'github-actions[bot]' ||
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    timeout-minutes: 55
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Wait for exact-head quality, security, sync and full CI gates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const required = ['CI-Gate', 'quality-gate', 'dependency-review',
              'Verify (status, secrets, versions, tests)'];
            // The complete Windows/macOS matrix can exceed 15 minutes.
            const deadline = Date.now() + 45 * 60 * 1000;
            let nextProgressLog = 0;
            while (Date.now() < deadline) {
              const pr = (await github.rest.pulls.get({...context.repo,
                pull_number: context.payload.pull_request.number})).data;
              if (pr.head.sha !== process.env.EXPECTED_SHA || pr.state !== 'open') {
                core.setFailed('PR changed or closed; refusing to merge an unverified head.');
                return;
              }
              const checks = await github.paginate(github.rest.checks.listForRef,
                {...context.repo, ref: pr.head.sha, per_page: 100});
              const latest = name => checks.filter(c => c.name === name &&
                c.app?.slug === 'github-actions').sort((a,b) => b.id-a.id)[0];
              const gates = required.map(latest);
              if (gates.some(c => c?.status === 'completed' && c.conclusion !== 'success')) {
                core.setFailed('A mandatory gate failed; automatic merge is blocked.');
                return;
              }
              if (gates.every(c => c?.conclusion === 'success')) {
                core.info('All mandatory gates passed for the exact PR head.');
                return;
              }
              if (Date.now() >= nextProgressLog) {
                const summary = required.map((name, index) => {
                  const check = gates[index];
                  const state = check
                    ? `${check.status}/${check.conclusion || 'pending'}`
                    : 'missing';
                  return `${name}=${state}`;
                }).join(', ');
                core.info(`Waiting for exact-head required checks: ${summary}`);
                nextProgressLog = Date.now() + 60000;
              }
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            core.setFailed('Gates missing or still pending; PR remains open for review.');
      - name: Request squash merge without bypassing protection
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --squash --auto --match-head-commit "$EXPECTED_SHA" --delete-branch
      - name: Report actual merge state
        run: |
          set -euo pipefail
          gh pr view "$PR_URL" --json state,autoMergeRequest,url
          echo 'Merge requested after checks; GitHub branch rules still apply.' >> "$GITHUB_STEP_SUMMARY"
