name: Sync README status

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: readme-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    # Fork PRs cannot be pushed safely; their README diff is still covered by CI.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Generate README from PR tree as data
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HEAD_SHA"
          rm -rf /tmp/mountfile-pr
          mkdir -p /tmp/mountfile-pr
          git archive "$HEAD_SHA" | tar -x -C /tmp/mountfile-pr
          python scripts/generate_readme.py \
            --repo-root /tmp/mountfile-pr \
            --output /tmp/README.generated \
            --revision "$HEAD_REF"
          git checkout --detach "$HEAD_SHA"
          cp /tmp/README.generated README.md

      - name: Generate README on default branch
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/generate_readme.py --revision "${GITHUB_REF_NAME}"

      - name: Commit README when content changed
        env:
          HEAD_REF_PUSH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo 'README is already synchronized.'
            exit 0
          fi
          git config user.name 'mount-file README bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: synchronize generated README status'
          if [ "${{ github.event_name }}" = 'pull_request_target' ]; then
            git push origin "HEAD:$HEAD_REF_PUSH"
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
