name: CI Guardian

# Creates one tracked incident issue for a failing trusted main-branch run and
# closes it after a later successful run. It never edits source or auto-merges.
on:
  workflow_run:
    workflows: [CI, Quality, Security, mfsync]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: ci-guardian-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile CI incident issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow = process.env.WORKFLOW_NAME || 'manual check';
            const conclusion = process.env.CONCLUSION || 'unknown';
            const shortSha = (process.env.HEAD_SHA || 'unknown').slice(0, 12);
            const title = `[automation] ${workflow} failed on main`;
            const labels = ['automation', 'ci-failure'];
            const body = [
              `## Automated CI incident`,
              ``,
              `Workflow **${workflow}** failed for main at commit \`${shortSha}\`.`,
              ``,
              `- Conclusion: \`${conclusion}\``,
              `- Run: ${process.env.RUN_URL || 'not available'}`,
              `- Run id: \`${process.env.WORKFLOW_ID || 'not available'}\``,
              ``,
              `This issue is generated by **CI Guardian**. It is intentionally deduplicated, does not modify source code, and does not merge fixes. Review the run logs, then use the existing autofix/self-heal PR workflows only when the change is safe and reviewable.`,
            ].join('\n');

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            await ensureLabel('automation', '1f6feb', 'Automated repository maintenance');
            await ensureLabel('ci-failure', 'd73a4a', 'A trusted CI workflow failed');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'automation,ci-failure',
              per_page: 100,
            });
            const matching = existing.filter(issue => issue.title === title);

            if (process.env.EVENT_NAME === 'workflow_dispatch') {
              core.info('Manual dispatch is a dry reconciliation; no issue was created or closed.');
              return;
            }

            if (conclusion === 'failure' || conclusion === 'cancelled' || conclusion === 'timed_out') {
              if (matching.length > 0) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: matching[0].number,
                  body: `Another failure was observed at \`${shortSha}\`: ${process.env.RUN_URL}`,
                });
                core.info(`Updated existing incident #${matching[0].number}.`);
              } else {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels,
                });
                core.info(`Created incident #${created.data.number}.`);
              }
              return;
            }

            if (conclusion === 'success') {
              for (const issue of matching) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `Recovery detected at commit \`${shortSha}\` via ${process.env.RUN_URL}. Closing this incident; reopen if the failure persists.`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.info(`Closed recovered incident #${issue.number}.`);
              }
            }
