name: CI Nightly Windows

on:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    name: Nightly Windows test and build
    timeout-minutes: 45
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest pytest-timeout hypothesis wheel
          python -m pip install -r requirements.txt
          python -m pip install 'fastapi>=0.165,<1.0' 'uvicorn>=0.54,<1.0' 'httpx>=0.28,<1.0'
      - name: Run Windows tests
        run: python -m pytest tests/ -q
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --icon mountfile/data/icon.ico `
            --collect-data mountfile `
            --name MountFile-nightly main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          if (-not (Test-Path 'dist/MountFile-nightly.exe')) { throw 'Nightly executable missing' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MountFile-nightly-${{ github.sha }}
          path: dist/MountFile-nightly.exe
          if-no-files-found: error
          retention-days: 7

  acceptance-matrix:
    name: Nightly acceptance and failure matrix (Linux)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install filesystem oracles and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs dosfstools exfatprogs ntfs-3g
          python -m pip install pytest pytest-timeout hypothesis
          python -m pip install -r requirements.txt
      - name: Run failure-injection and oracle suites
        run: >-
          python -m pytest tests/test_writer_fault_coverage.py
          tests/test_ntfs_writer_fault_coverage.py tests/test_ntfs_replay.py
          tests/test_ntfs_replay_oracle.py
          tests/test_native_writer_failure_matrix.py -q
      - name: Emit failure coverage matrix
        run: python scripts/failure_matrix_artifact.py --repo-root . --json-out failure-matrix-nightly.json
      - name: Validate failure coverage matrix
        run: python scripts/failure_matrix_artifact.py --repo-root . --validate failure-matrix-nightly.json
      - name: Emit NTFS replay oracle evidence
        run: python scripts/ntfs_oracle_evidence.py --repo-root . --json-out ntfs-oracle-evidence.json
      - name: Emit checker capability matrix
        run: python scripts/checker_matrix.py --json-out checker-matrix-nightly.json
      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: acceptance-matrix-${{ github.sha }}
          path: |
            failure-matrix-nightly.json
            ntfs-oracle-evidence.json
            checker-matrix-nightly.json
          if-no-files-found: error
          retention-days: 14
