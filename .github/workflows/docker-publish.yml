name: Docker Publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-mountfile-latest
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish verified main image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Validate compose configuration
        run: docker compose config
      - name: Build and smoke-test image
        run: |
          set -euo pipefail
          docker build --tag mountfile:publish .
          docker run --rm --read-only --cap-drop=ALL --security-opt no-new-privileges mountfile:publish --version
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/alexkkkkk/mount-file:main,ghcr.io/alexkkkkk/mount-file:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
