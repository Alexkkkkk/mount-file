name: NTFS Windows Acceptance
# Revision 2: raw $MFT/$BITMAP snapshots and byte comparator are required.

on:
  # No push trigger: this workflow only needs the schedule, the pull_request
  # paths filter below and manual runs, so a push to any branch no longer
  # duplicates a full Windows acceptance run.
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch: {}
  merge_group: {}
  pull_request:
    paths:
      - '.github/workflows/ntfs-windows-acceptance.yml'
      - 'scripts/windows_ntfs_acceptance.ps1'
      - 'mountfile/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: ntfs-windows-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-ntfs-checker:
    name: Windows NTFS VHDX + chkdsk acceptance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install MountFile runtime for raw NTFS parser
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Install local MountFile package for acceptance scripts
        shell: pwsh
        run: python -m pip install --no-deps .

      - name: Create disposable NTFS VHDX and run native checker
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\mountfile-ntfs-windows" | Out-Null
          & .\scripts\windows_ntfs_acceptance.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP\mountfile-ntfs-windows"
          if ($LASTEXITCODE -ne 0) { throw "Windows NTFS acceptance failed" }

      - name: Assert typed Windows acceptance result
        shell: pwsh
        run: |
          $report = Get-Content "$env:RUNNER_TEMP\mountfile-ntfs-windows\windows-ntfs-acceptance.json" | ConvertFrom-Json
          if ($report.schema -ne 'mountfile.windows-ntfs-acceptance/v1') { throw 'invalid acceptance schema' }
          if ($report.checker_authority -ne 'windows_native') { throw 'non-Windows checker evidence' }
          if ($report.status -ne 'checked_and_repaired') { throw "unexpected status: $($report.status)" }
          if ($report.sentinel_sha256_before -ne $report.sentinel_sha256_after) { throw 'sentinel hash changed' }
          if ($report.crash_fixture.kind -ne 'windows-child-process-terminated-during-ntfs-write') { throw 'missing abrupt crash fixture' }
          if (-not $report.raw_snapshot_comparison.mft) { throw 'missing $MFT comparison' }
          if (-not $report.raw_snapshot_comparison.mftmirr) { throw 'missing $MFTMirr comparison' }
          if (-not $report.raw_snapshot_comparison.bitmap) { throw 'missing $BITMAP comparison' }
          if (-not $report.raw_crash_repair_comparison.mft) { throw 'missing crash/repaired $MFT comparison' }
          if (-not $report.raw_crash_repair_comparison.mftmirr) { throw 'missing crash/repaired $MFTMirr comparison' }
          if (-not $report.raw_crash_repair_comparison.bitmap) { throw 'missing crash/repaired $BITMAP comparison' }
          if (-not $report.raw_snapshot_comparison.logfile) { throw 'missing $LogFile comparison' }
          if (-not $report.raw_crash_repair_comparison.logfile) { throw 'missing crash/repaired $LogFile comparison' }
          if (-not $report.native_replay_comparison) { throw 'missing native replay comparison' }
          if ($report.native_replay_comparison.status -ne 'pass' -and $report.native_replay_comparison.status -ne 'not_applicable') { throw 'native replay comparison did not pass' }

      - name: Upload Windows checker evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ntfs-windows-acceptance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mountfile-ntfs-windows/windows-ntfs-acceptance.json
            ${{ runner.temp }}/mountfile-ntfs-windows/raw-before/
            ${{ runner.temp }}/mountfile-ntfs-windows/raw-crash/
            ${{ runner.temp }}/mountfile-ntfs-windows/raw-after/
            ${{ runner.temp }}/mountfile-ntfs-windows/raw-snapshot-comparison.json
            ${{ runner.temp }}/mountfile-ntfs-windows/raw-crash-repair-comparison.json
            ${{ runner.temp }}/mountfile-ntfs-windows/native-replay-comparison.json
            ${{ runner.temp }}/mountfile-ntfs-windows/native-replayed-volume.img
          if-no-files-found: error
          retention-days: 30
