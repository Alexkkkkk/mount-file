name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  tests:
    if: ${{ github.event_name != 'schedule' }}
    name: ${{ matrix.check_name }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest и 3.11 пришли из удалённого dfir-quality.yml:
        # это было единственное, что тот workflow добавлял к ci.yml.
        include:
          - os: ubuntu-latest
            python: "3.10"
            check_name: "test (3.10)"
          - os: ubuntu-latest
            python: "3.11"
            check_name: "test (3.11)"
          - os: ubuntu-latest
            python: "3.12"
            check_name: "test (3.12)"
          - os: windows-latest
            python: "3.10"
            check_name: "Tests (windows-latest, py3.10)"
          - os: windows-latest
            python: "3.11"
            check_name: "Tests (windows-latest, py3.11)"
          - os: windows-latest
            python: "3.12"
            check_name: "Tests (windows-latest, py3.12)"
          - os: macos-latest
            python: "3.10"
            check_name: "Tests (macos-latest, py3.10)"
          - os: macos-latest
            python: "3.11"
            check_name: "Tests (macos-latest, py3.11)"
          - os: macos-latest
            python: "3.12"
            check_name: "Tests (macos-latest, py3.12)"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Linux Qt runtime libraries are needed for GUI tests; without them the
      # import is skipped. The system tools build FAT32 fixtures in CI.
      - name: Install system tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools e2fsprogs \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install Qt and pytest with coverage
        run: |
          python -m pip install --upgrade pip pytest pytest-cov setuptools wheel 'PyQt6>=6.11.0'
          python -m pip install 'fastapi>=0.115,<1.0' 'uvicorn>=0.30,<1.0' 'httpx>=0.27,<1.0' 'regex>=2024.0.0'

      - name: Validate Windows installers without system changes
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./scripts/test-windows-installers.ps1
          if (-not $?) { throw 'PowerShell mock tests failed' }
          & ./scripts/install-windows-components.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { throw 'component dry-run failed' }
          & ./scripts/install-windows.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { throw 'source bootstrap dry-run failed' }

      # Modest package-wide floor: OS-specific and optional GUI/backends are
      # intentionally not exercised on every matrix leg; fail only on a broad
      # loss of exercised MountFile code, while still publishing the report.
      - name: Run tests with coverage
        run: >-
          python -m pytest tests/ -v
          --cov=mountfile --cov-report=term --cov-report=xml:coverage.xml
          --cov-fail-under=20

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  # Keep the legacy protected context while tests run only once in the matrix.
  # It fails closed unless the complete matrix, including Ubuntu/Python 3.12, passes.
  ubuntu-py312-compat:
    name: Tests (ubuntu-latest, py3.12)
    needs: [tests]
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    env:
      TEST_MATRIX_RESULT: ${{ needs.tests.result }}
    steps:
      - name: Preserve the protected legacy status context
        run: |
          if [ "$TEST_MATRIX_RESULT" != 'success' ]; then
            echo "::error::The consolidated test matrix ended with $TEST_MATRIX_RESULT"
            exit 1
          fi

  integration:
    if: ${{ github.event_name != 'schedule' }}
    name: Integration (pytsk3 + mkfs.vfat, Linux)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      # pytsk3 builds bundled libtsk from source; the build tools ship
      # with ubuntu-latest but must be present for pip to compile it.
      # The Qt runtime libraries are required too: requirements.txt pulls
      # in PyQt6, but without libEGL/libGL the binding cannot import and
      # every GUI test in tests/test_build_ci.py is silently skipped
      # instead of running.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools build-essential \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov 'setuptools>=68' wheel
          python -m pip install -r requirements.txt

      - name: Run the full suite with pytsk3 available
        run: >-
          python -m pytest tests/ -v --cov=mountfile --cov-report=term
          --cov-fail-under=20

      - name: Entry-point and GUI import diagnostics
        run: |
          python main.py --version
          python main.py --diag
          python -c "from mountfile.mainwindow import MainWindow; from mountfile.hexview import HexView; print('GUI import OK')"

  build:
    if: ${{ github.event_name != 'schedule' }}
    name: Build (${{ matrix.os }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MountFile.exe
          - os: ubuntu-latest
            artifact: MountFile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Build the standalone binary (PyInstaller)
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --collect-submodules pytsk3 \
            --collect-data mountfile \
            --icon "$(python -m mountfile.appicon)" \
            --name MountFile main.py
          test -f "dist/${{ matrix.artifact }}"

      - name: Smoke-check the binary
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen ./dist/MountFile --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MountFile-${{ matrix.os }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  gui-import:
    if: ${{ github.event_name != 'schedule' }}
    name: GUI import (Windows, PyQt6)
    timeout-minutes: 30
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PyQt6
        run: |
          pip install PyQt6
          pip install 'fastapi>=0.115,<1.0' 'uvicorn>=0.30,<1.0' 'httpx>=0.27,<1.0'
      - name: Import the GUI modules headless
        shell: bash
        run: |
          python -c "import mountfile.qt_compat as q; assert q.QT6, 'expected PyQt6'; print('qt_compat OK, QT6 =', q.QT6)"
          python -c "from mountfile.mainwindow import MainWindow; from mountfile.hexview import HexView; print('GUI import OK')"

  gui:
    if: ${{ github.event_name != 'schedule' }}
    name: gui smoke test (offscreen)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - name: Install GUI smoke-test dependencies
        run: |
          python -m pip install --upgrade pip pytest PyQt6
          python -m pip install 'fastapi>=0.115,<1.0' 'uvicorn>=0.30,<1.0' 'httpx>=0.27,<1.0'
      - name: Run focused headless GUI smoke tests
        run: python -m pytest tests/test_gui_smoke.py -v


  nightly:
    name: Nightly Windows test and build
    if: ${{ github.event_name == 'schedule' }}
    timeout-minutes: 45
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest
          python -m pip install -r requirements.txt
          python -m pip install 'fastapi>=0.115,<1.0' 'uvicorn>=0.30,<1.0' 'httpx>=0.27,<1.0'

      - name: Run Windows tests
        run: python -m pytest tests/ -q

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --icon mountfile/data/icon.ico `
            --collect-data mountfile `
            --name MountFile-nightly main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          if (-not (Test-Path 'dist/MountFile-nightly.exe')) { throw 'Nightly executable missing' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MountFile-nightly-${{ github.sha }}
          path: dist/MountFile-nightly.exe
          if-no-files-found: error
          retention-days: 7

  ci-gate:
    name: CI-Gate
    needs: [tests, ubuntu-py312-compat, integration, build, gui-import, gui]
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TESTS: ${{ needs.tests.result }}
      UBUNTU_PY312: ${{ needs.ubuntu-py312-compat.result }}
      INTEGRATION: ${{ needs.integration.result }}
      BUILD: ${{ needs.build.result }}
      GUI_IMPORT: ${{ needs.gui-import.result }}
      GUI: ${{ needs.gui.result }}
    steps:
      - name: Require every CI stage to succeed
        run: |
          set -euo pipefail
          for result in "$TESTS" "$UBUNTU_PY312" "$INTEGRATION" "$BUILD" "$GUI_IMPORT" "$GUI"; do
            if [ "$result" != 'success' ]; then
              echo "::error::A required CI stage ended with $result"
              exit 1
            fi
          done
