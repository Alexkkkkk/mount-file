      - name: Emit external-checker inventory for this platform
        if: always()
        run: python scripts/checker_matrix.py --json-out checker-matrix.json

      - name: Upload platform checker inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: external-checker-matrix-${{ matrix.os }}-py${{ matrix.python }}
          path: checker-matrix.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify installable AI surface
        shell: bash
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python - <<'PY'
          import glob
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile
          import venv

          wheel = pathlib.Path(glob.glob("dist/*.whl")[0]).resolve()
          env_dir = pathlib.Path(tempfile.mkdtemp(prefix="mountfile-wheel-smoke-"))
          venv.EnvBuilder(with_pip=True).create(env_dir)
          scripts = env_dir / ("Scripts" if os.name == "nt" else "bin")
          python = scripts / ("python.exe" if os.name == "nt" else "python")
          cli = scripts / ("mountfile-ai.exe" if os.name == "nt" else "mountfile-ai")

          # AI is an optional extra; install it explicitly when validating the
          # AI entry points instead of testing a deliberately dependency-free wheel.
          subprocess.run([str(python), "-m", "pip", "install", f"{wheel}[ai]"], check=True)
          subprocess.run(
              [str(python), "-c", "import mountfile.ai, mountfile_ai"], check=True
          )
          subprocess.run([str(cli), "--help"], check=True)
          PY

  # Keep the legacy protected context while tests run only once in the matrix.
  # It fails closed unless the complete matrix, including Ubuntu/Python 3.12, passes.
  ubuntu-py312-compat:
    name: Tests (ubuntu-latest, py3.12)
    needs: [tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      TEST_MATRIX_RESULT: ${{ needs.tests.result }}
    steps:
      - name: Preserve the protected legacy status context
        run: |
          if [ "$TEST_MATRIX_RESULT" != 'success' ]; then
            echo "::error::The consolidated test matrix ended with $TEST_MATRIX_RESULT"
            exit 1
          fi

  integration:
    name: Integration (pytsk3 + mkfs.vfat, Linux)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      # pytsk3 builds bundled libtsk from source; the build tools ship
      # with ubuntu-latest but must be present for pip to compile it.
      # ntfs-3g supplies mkfs.ntfs and ntfsfix for the real-image checker case.
      # The Qt runtime libraries are required too: requirements.txt pulls
      # in PyQt6, but without libEGL/libGL the binding cannot import and
      # every GUI test in tests/test_build_ci.py is silently skipped
      # instead of running.
      - name: Install system packages
        run: |
          sudo apt-get update
          xargs -r sudo apt-get install -y < <(grep -vE '^[[:space:]]*(#|$)' tools/system-packages-debian.txt)
          sudo apt-get install -y build-essential

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov hypothesis pytsk3 'setuptools>=68' wheel
          python -m pip install -r requirements.txt

      - name: Run the full suite with pytsk3 available
        run: >-
          python -m pytest tests/ -v --cov=mountfile --cov-report=term
          --cov-fail-under=20

      - name: Emit external-checker capability matrix
        run: python scripts/checker_matrix.py --json-out checker-matrix.json

      - name: Upload external-checker capability matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: external-checker-matrix-linux
          path: checker-matrix.json
          if-no-files-found: error
          retention-days: 14

      - name: Execute checker fixture acceptance matrix
        run: >-
          python scripts/checker_acceptance.py
          --json-out checker-acceptance.json
          --junitxml checker-acceptance-junit.xml

      - name: Upload checker fixture acceptance artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checker-fixture-acceptance-linux
          path: |
            checker-acceptance.json
            checker-acceptance-junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: Execute writer recovery acceptance fixtures
        run: >-
          python scripts/recovery_acceptance.py
          --json-out recovery-acceptance.json
          --junitxml recovery-acceptance-junit.xml

      - name: Upload writer recovery acceptance artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: writer-recovery-acceptance-linux
          path: |
            recovery-acceptance.json
            recovery-acceptance-junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: Validate conservative product status contract
        run: python scripts/product_status_contract.py --json-out product-status.json

      - name: Upload product status contract
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: product-status-contract-linux
          path: product-status.json
          if-no-files-found: error
          retention-days: 14

      - name: Entry-point and GUI import diagnostics
        run: |
          python main.py --version
          python main.py --diag
          python -c "from mountfile.mainwindow import MainWindow; from mountfile.hexview import HexView; print('GUI import OK')"

      - name: Run reproducible read-only VFS benchmark
        env:
          PYTHON_BIN: python
          INCLUDE_10M: "1"
        run: |
          rm -f checker-matrix.json checker-acceptance.json checker-acceptance-junit.xml
          rm -f recovery-acceptance.json recovery-acceptance-junit.xml product-status.json
          output_dir="${RUNNER_TEMP}/mountfile-vfs-benchmark"
          scripts/run_vfs_benchmarks.sh "${output_dir}"
          python scripts/benchmark_artifact.py \
            "${output_dir}/bench_report.json" \
            --json-out "${output_dir}/benchmark-validation.json"

      - name: Upload reproducible benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vfs-benchmark-linux
          path: |
            ${{ runner.temp }}/mountfile-vfs-benchmark/bench_report.json
            ${{ runner.temp }}/mountfile-vfs-benchmark/benchmark-validation.json
          if-no-files-found: ignore
          retention-days: 14

  build:
    if: ${{ always() }}
    name: Build (${{ matrix.os }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MountFile.exe
          - os: ubuntu-latest
            artifact: MountFile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Build the standalone binary (PyInstaller)
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --collect-submodules pytsk3 \
            --collect-data mountfile \
            --icon "$(python -m mountfile.appicon)" \
            --name MountFile main.py
          test -f "dist/${{ matrix.artifact }}"

      - name: Smoke-check the binary
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen ./dist/MountFile --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MountFile-${{ matrix.os }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  gui-import:
    if: ${{ always() }}
    name: GUI import (Windows, PyQt6)
    timeout-minutes: 30
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PyQt6
        run: |
          pip install PyQt6
          pip install 'fastapi>=0.115,<1.0' 'uvicorn>=0.30,<1.0' 'httpx>=0.27,<1.0'
      - name: Import the GUI modules headless
        shell: bash
        run: |
          python -c "import mountfile.qt_compat as q; assert q.QT6, 'expected PyQt6'; print('qt_compat OK, QT6 =', q.QT6)"
          python -c "from mountfile.mainwindow import MainWindow; from mountfile.hexview import HexView; print('GUI import OK')"

  gui:
    name: gui smoke test (offscreen)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - name: Install GUI smoke-test dependencies
        run: |
          python -m pip install --upgrade pip pytest PyQt6
          python -m pip install 'fastapi>=0.115,<1.0' 'uvicorn>=0.30,<1.0' 'httpx>=0.27,<1.0'
      - name: Run focused headless GUI smoke tests
        run: python -m pytest tests/test_gui_smoke.py -v


  ai-safety:
    name: AI safety contracts (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic test dependencies
        run: python -m pip install pytest hypothesis 'pydantic>=2.0'

      - name: Run AI safety and structured-output contracts
        run: >-
          python -m pytest -q
          tests/test_ai_agents.py
          tests/test_ai_backend.py
          tests/test_ai_guard.py
          tests/test_ai_legacy_agent.py
          tests/test_ai_redteam.py
          tests/test_ai_schema.py
          tests/test_ai_structured_backend.py
          tests/test_mcp_server.py
          --junitxml=ai-safety-results.xml

      - name: Upload AI safety test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ai-safety-results-${{ github.sha }}
          path: ai-safety-results.xml
          if-no-files-found: ignore
          retention-days: 14

  ci-gate:
    name: CI-Gate
    needs: [tests, ubuntu-py312-compat, integration, build, gui-import, gui, ai-safety]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TESTS: ${{ needs.tests.result }}
      UBUNTU_PY312: ${{ needs.ubuntu-py312-compat.result }}
      INTEGRATION: ${{ needs.integration.result }}
      BUILD: ${{ needs.build.result }}
      GUI_IMPORT: ${{ needs.gui-import.result }}
      GUI: ${{ needs.gui.result }}
      AI_SAFETY: ${{ needs.ai-safety.result }}
    steps:
      - name: Require every CI stage to succeed
        run: |
          set -euo pipefail
          for result in "$TESTS" "$UBUNTU_PY312" "$INTEGRATION" "$BUILD" "$GUI_IMPORT" "$GUI" "$AI_SAFETY"; do
            if [ "$result" != 'success' ]; then
              echo "::error::A required CI stage ended with $result"
              exit 1
            fi
          done
