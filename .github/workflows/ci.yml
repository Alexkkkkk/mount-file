name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------- tests
  tests:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pytest
        run: pip install pytest

      # Tests only import partition/fat32/firmware: no Qt and no pytsk3
      # are required, so this job is fast and reliable everywhere.
      - name: Run tests
        run: python -m pytest tests/ -v

  # -------------------------------------------------- GUI import smoke test
  # Catches exactly the kind of bug that broke Windows 10 startup
  # (wrong Qt module imports): the GUI modules must import cleanly.
  gui-import:
    name: GUI import (Windows, PyQt6)
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyQt6
        run: pip install PyQt6

      - name: Import GUI modules headless
        shell: bash
        run: |
          python -c "import mountfile.qt_compat as q; assert q.QT6, 'expected PyQt6'; print('qt_compat OK, QT6 =', q.QT6)"
          python -c "from mountfile.mainwindow import MainWindow; from mountfile.hexview import HexView; print('GUI import OK')"
