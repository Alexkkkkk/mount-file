name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.check_name }}
    # Per-leg budget. macOS runners are markedly slower than Linux and a
    # cancelled leg used to poison the whole matrix (a cancelled matrix leg
    # makes the fail-closed "Tests (ubuntu-latest, py3.12)" gate exit 1, which
    # in turn fails CI-Gate) so the whole branch went BLOCKED for infra
    # reasons, not for a real test failure.
    timeout-minutes: ${{ matrix.timeout }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest и 3.11 пришли из удалённого dfir-quality.yml:
        # это было единственное, что тот workflow добавлял к ci.yml.
        include:
          - os: ubuntu-latest
            python: "3.10"
            check_name: "test (3.10)"
            timeout: 40
          - os: ubuntu-latest
            python: "3.11"
            check_name: "test (3.11)"
            timeout: 40
          - os: ubuntu-latest
            python: "3.12"
            check_name: "test (3.12)"
            timeout: 40
          - os: windows-latest
            python: "3.10"
            check_name: "Tests (windows-latest, py3.10)"
            timeout: 40
          - os: windows-latest
            python: "3.11"
            check_name: "Tests (windows-latest, py3.11)"
            timeout: 40
          - os: windows-latest
            python: "3.12"
            check_name: "Tests (windows-latest, py3.12)"
            timeout: 40
          - os: macos-latest
            python: "3.10"
            check_name: "Tests (macos-latest, py3.10)"
            timeout: 75
          - os: macos-latest
            python: "3.11"
            check_name: "Tests (macos-latest, py3.11)"
            timeout: 75
          - os: macos-latest
            python: "3.12"
            check_name: "Tests (macos-latest, py3.12)"
            timeout: 75
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Linux Qt runtime libraries are needed for GUI tests; without them the
      # import is skipped. The system tools build FAT32 fixtures in CI.
      - name: Install system tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          xargs -r sudo apt-get install -y < <(grep -vE '^[[:space:]]*(#|$)' tools/system-packages-debian.txt)

      - name: Require filesystem oracle tools (Linux)
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          import shutil
          import sys

          required = (
              "mke2fs", "e2fsck", "mkfs.fat", "fsck.fat",
              "mkfs.exfat", "fsck.exfat", "mkfs.ntfs", "ntfsfix",
          )
          missing = [tool for tool in required if shutil.which(tool) is None]
          if missing:
              print("Missing required filesystem oracle tools:", ", ".join(missing))
              sys.exit(1)
          print("All required filesystem oracle tools are available.")
          PY

      - name: Install Qt and pytest with coverage
        uses: ./.github/actions/python-test-env

      - name: Validate Windows installers without system changes
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $evidencePath = 'windows-installer-evidence.json'
          & ./scripts/test-windows-installers.ps1 -EvidencePath $evidencePath
          if (-not $?) { throw 'PowerShell mock tests failed' }
          & ./scripts/install-windows-components.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { throw 'component dry-run failed' }
          & ./scripts/install-windows.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { throw 'source bootstrap dry-run failed' }
          $report = Get-Content $evidencePath -Raw | ConvertFrom-Json
          $report.checks = @($report.checks) + @(
            [pscustomobject]@{ id='component-installer-dry-run'; status='pass' },
            [pscustomobject]@{ id='source-bootstrap-dry-run'; status='pass' }
          )
          $report.check_count = $report.checks.Count
          $report | ConvertTo-Json -Depth 8 | Set-Content -Path $evidencePath -Encoding UTF8

      - name: Upload Windows platform adapter evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-installer-evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: windows-installer-evidence.json
          if-no-files-found: error
          retention-days: 14

      # Modest package-wide floor: OS-specific and optional GUI/backends are
      # intentionally not exercised on every matrix leg; fail only on a broad
      # loss of exercised MountFile code, while still publishing the report.
      - name: Run tests with coverage
        run: >-
          python -m pytest tests/ -v
          --timeout=600 --timeout-method=thread
          --cov=mountfile --cov-report=term --cov-report=xml:coverage.xml
          --junitxml=test-results.xml
          --cov-fail-under=20

      - name: Upload detailed test outcomes (including skips and xfails)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Emit cross-platform native read fixture evidence
        if: always()
        run: >-
          python scripts/native_read_evidence.py
          --junitxml test-results.xml
          --windows-installer-evidence windows-installer-evidence.json
          --json-out native-read-evidence.json

      - name: Upload native read fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-read-evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: native-read-evidence.json
          if-no-files-found: error
          retention-days: 14

<<<<<<< HEAD
