name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # system tools used by tests/test_build_ci.py to build a FAT32
      # fixture on the fly (skipped automatically when not installed)
      - name: Install system tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dosfstools mtools

      - name: Install pytest with coverage
        run: |
          python -m pip install --upgrade pip pytest pytest-cov
          python -m pip install 'fastapi>=0.115,<1.0' 'uvicorn>=0.30,<1.0' 'httpx>=0.27,<1.0'

      - name: Run tests with coverage (one automatic retry)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 10
          command: >-
            python -m pytest tests/ -v
            --cov=mountfile --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Integration (pytsk3 + mkfs.vfat, Linux)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # pytsk3 builds bundled libtsk from source; the build tools ship
      # with ubuntu-latest but must be present for pip to compile it.
      # The Qt runtime libraries are required too: requirements.txt pulls
      # in PyQt6, but without libEGL/libGL the binding cannot import and
      # every GUI test in tests/test_build_ci.py is silently skipped
      # instead of running.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools build-essential \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov
          python -m pip install -r requirements.txt

      - name: Run the full suite with pytsk3 available
        run: python -m pytest tests/ -v --cov=mountfile --cov-report=term

      - name: Entry-point diagnostics
        run: |
          python main.py --version
          python main.py --diag

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MountFile.exe
          - os: ubuntu-latest
            artifact: MountFile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Build the standalone binary (PyInstaller)
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --collect-submodules pytsk3 \
            --name MountFile main.py
          test -f "dist/${{ matrix.artifact }}"

      - name: Smoke-check the binary
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen ./dist/MountFile --version

      - uses: actions/upload-artifact@v7
        with:
          name: MountFile-${{ matrix.os }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  gui-import:
    name: GUI import (Windows, PyQt6)
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PyQt6
        run: |
          pip install PyQt6
          pip install 'fastapi>=0.115,<1.0' 'uvicorn>=0.30,<1.0' 'httpx>=0.27,<1.0'
      - name: Import the GUI modules headless
        shell: bash
        run: |
          python -c "import mountfile.qt_compat as q; assert q.QT6, 'expected PyQt6'; print('qt_compat OK, QT6 =', q.QT6)"
          python -c "from mountfile.mainwindow import MainWindow; from mountfile.hexview import HexView; print('GUI import OK')"

  gui:
    name: gui smoke test (offscreen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - name: Install PyQt6
        run: |
          python -m pip install --upgrade pip pytest PyQt6
          python -m pip install 'fastapi>=0.115,<1.0' 'uvicorn>=0.30,<1.0' 'httpx>=0.27,<1.0'
      - name: Import and build the window without a display
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from mountfile.mainwindow import MainWindow; print('GUI import OK')"
          python -m pytest tests/ -v
