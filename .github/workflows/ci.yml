name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  tests:
    if: ${{ github.event_name != 'schedule' }}
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest и 3.11 пришли из удалённого dfir-quality.yml:
        # это было единственное, что тот workflow добавлял к ci.yml.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # system tools used by tests/test_build_ci.py to build a FAT32
      # fixture on the fly (skipped automatically when not installed)
      - name: Install system tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dosfstools mtools

      - name: Install pytest with coverage
        run: |
          python -m pip install --upgrade pip pytest pytest-cov
          python -m pip install 'fastapi>=0.115,<1.0' 'uvicorn>=0.30,<1.0' 'httpx>=0.27,<1.0'

      - name: Run tests with coverage
        run: >-
          python -m pytest tests/ -v
          --cov=mountfile --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  integration:
    if: ${{ github.event_name != 'schedule' }}
    name: Integration (pytsk3 + mkfs.vfat, Linux)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      # pytsk3 builds bundled libtsk from source; the build tools ship
      # with ubuntu-latest but must be present for pip to compile it.
      # The Qt runtime libraries are required too: requirements.txt pulls
      # in PyQt6, but without libEGL/libGL the binding cannot import and
      # every GUI test in tests/test_build_ci.py is silently skipped
      # instead of running.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools build-essential \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov
          python -m pip install -r requirements.txt

      - name: Run the full suite with pytsk3 available
        run: python -m pytest tests/ -v --cov=mountfile --cov-report=term

      - name: Entry-point and GUI import diagnostics
        run: |
          python main.py --version
          python main.py --diag
          python -c "from mountfile.mainwindow import MainWindow; from mountfile.hexview import HexView; print('GUI import OK')"

  build:
    if: ${{ github.event_name != 'schedule' }}
    name: Build (${{ matrix.os }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MountFile.exe
          - os: ubuntu-latest
            artifact: MountFile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Build the standalone binary (PyInstaller)
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --collect-submodules pytsk3 \
            --icon "$(python -m mountfile.appicon)" \
            --add-data "mountfile/data/icon.png:mountfile/data" \
            --name MountFile main.py
          test -f "dist/${{ matrix.artifact }}"

      - name: Smoke-check the binary
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen ./dist/MountFile --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MountFile-${{ matrix.os }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  gui-import:
    if: ${{ github.event_name != 'schedule' }}
    name: GUI import (Windows, PyQt6)
    timeout-minutes: 30
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PyQt6
        run: |
          pip install PyQt6
          pip install 'fastapi>=0.115,<1.0' 'uvicorn>=0.30,<1.0' 'httpx>=0.27,<1.0'
      - name: Import the GUI modules headless
        shell: bash
        run: |
          python -c "import mountfile.qt_compat as q; assert q.QT6, 'expected PyQt6'; print('qt_compat OK, QT6 =', q.QT6)"
          python -c "from mountfile.mainwindow import MainWindow; from mountfile.hexview import HexView; print('GUI import OK')"


  nightly:
    name: Nightly Windows test and build
    if: ${{ github.event_name == 'schedule' }}
    timeout-minutes: 45
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-win7.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest
          python -m pip install -r requirements-win7.txt
          python -m pip install 'fastapi>=0.115,<1.0' 'uvicorn>=0.30,<1.0' 'httpx>=0.27,<1.0'

      - name: Run Windows tests
        run: python -m pytest tests/ -q

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --icon mountfile/data/icon.ico `
            --add-data "mountfile/data/icon.png;mountfile/data" `
            --name MountFile-nightly main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          if (-not (Test-Path 'dist/MountFile-nightly.exe')) { throw 'Nightly executable missing' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MountFile-nightly-${{ github.sha }}
          path: dist/MountFile-nightly.exe
          if-no-files-found: error
          retention-days: 7

  ci-gate:
    name: CI-Gate
    needs: [tests, integration, build, gui-import]
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TESTS: ${{ needs.tests.result }}
      INTEGRATION: ${{ needs.integration.result }}
      BUILD: ${{ needs.build.result }}
      GUI_IMPORT: ${{ needs.gui-import.result }}
    steps:
      - name: Require every CI stage to succeed
        run: |
          set -euo pipefail
          for result in "$TESTS" "$INTEGRATION" "$BUILD" "$GUI_IMPORT"; do
            if [ "$result" != 'success' ]; then
              echo "::error::A required CI stage ended with $result"
              exit 1
            fi
          done
