name: External repository mirror

on:
  schedule:
    - cron: '30 1 * * 0'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-repository-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: >-
      vars.MIRROR_ENABLED == 'true' &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Push branches and tags to the configured mirror
        shell: bash
        env:
          MIRROR_REPOSITORY: ${{ vars.MIRROR_REPOSITORY }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${MIRROR_REPOSITORY:-}" || -z "${MIRROR_TOKEN:-}" ]]; then
            echo "::error::Set MIRROR_REPOSITORY (https://host/owner/repository.git) and the MIRROR_TOKEN secret before enabling the mirror."
            exit 1
          fi

          if [[ ! "$MIRROR_REPOSITORY" =~ ^https://([A-Za-z0-9.-]+)/([A-Za-z0-9_.-]+)/([A-Za-z0-9_._-]+[.]git)$ ]]; then
            echo "::error::MIRROR_REPOSITORY must use the HTTPS form https://host/owner/repository.git"
            exit 1
          fi
          mirror_host="${BASH_REMATCH[1]}"
          mirror_path="${BASH_REMATCH[2]}/${BASH_REMATCH[3]}"

          git remote add mirror "https://x-access-token:${MIRROR_TOKEN}@${mirror_host}/${mirror_path}"

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'

          while IFS= read -r remote_ref; do
            branch="${remote_ref#refs/remotes/origin/}"
            [[ "$branch" == 'HEAD' ]] && continue
            git push mirror "$remote_ref:refs/heads/$branch"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)

          git push mirror --tags
          echo 'Branches and tags were pushed to the HTTPS mirror without force or remote deletions.' >> "$GITHUB_STEP_SUMMARY"
