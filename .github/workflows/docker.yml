name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Docs-only / metadata-only PRs skip Docker and docs builds entirely.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-smoke:
    name: Docker build and CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # BuildKit + the GitHub Actions layer cache turn a cold ~2 min image
      # build into a few seconds whenever the Dockerfile layers are unchanged.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (GHA layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mountfile:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check CLI entrypoint
        run: docker run --rm --read-only --cap-drop=ALL --security-opt no-new-privileges mountfile:test --version

      - name: Check read-only evidence workflow
        shell: bash
        run: |
          mkdir -p evidence output
          printf 'not an image' > evidence/sample.bin
          docker run --rm --read-only --cap-drop=ALL \
            --security-opt no-new-privileges \
            --mount "type=bind,src=$PWD/evidence,dst=/evidence,ro" \
            --mount "type=bind,src=$PWD/output,dst=/output" \
            mountfile:test info /evidence/sample.bin || test $? -eq 1

      - name: Validate compose configuration
        run: docker compose config
