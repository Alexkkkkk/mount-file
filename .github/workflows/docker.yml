name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Docs-only / metadata-only PRs skip Docker and docs builds entirely.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-smoke:
    name: Docker build and CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: docker build --tag mountfile:test .

      - name: Check CLI entrypoint
        run: docker run --rm --read-only --cap-drop=ALL --security-opt no-new-privileges mountfile:test --version

      - name: Check read-only evidence workflow
        shell: bash
        run: |
          mkdir -p evidence output
          printf 'not an image' > evidence/sample.bin
          docker run --rm --read-only --cap-drop=ALL \
            --security-opt no-new-privileges \
            --mount "type=bind,src=$PWD/evidence,dst=/evidence,ro" \
            --mount "type=bind,src=$PWD/output,dst=/output" \
            mountfile:test info /evidence/sample.bin || test $? -eq 1

      - name: Validate compose configuration
        run: docker compose config
