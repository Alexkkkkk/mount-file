name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Push the verified image to GHCR (package visibility is managed separately)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke:
    name: Docker build and CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag mountfile:test .

      - name: Check CLI entrypoint
        run: docker run --rm --read-only --cap-drop=ALL --security-opt no-new-privileges mountfile:test --version

      - name: Check read-only evidence workflow
        shell: bash
        run: |
          mkdir -p evidence output
          printf 'not an image' > evidence/sample.bin
          docker run --rm --read-only --cap-drop=ALL \
            --security-opt no-new-privileges \
            --mount "type=bind,src=$PWD/evidence,dst=/evidence,ro" \
            --mount "type=bind,src=$PWD/output,dst=/output" \
            mountfile:test info /evidence/sample.bin || test $? -eq 1

      - name: Validate compose configuration
        run: docker compose config

  publish:
    name: Publish verified image to GHCR
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: build-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/alexkkkkk/mount-file
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
