name: mfsync
# Scheduled checks are read-only. A fresh runner cannot synchronize another
# computer's uncommitted files; local sync/watch must run on that computer.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verification only; repository writes use mfsync-sync.yml'
        required: true
        default: verify
        type: choice
        options: [verify]
permissions:
  contents: read
concurrency:
  group: mfsync-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify (status, secrets, versions, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Sync report
        run: python tools/mfsync.py status
      - name: Secret scan
        run: python tools/mfsync.py scan --all
      - name: Version parity
        run: python tools/mfsync.py check --strict
      - name: Automation regression tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_mfsync.py tests/test_release_version.py tests/test_automation_workflows.py -q
      - name: Machine-readable report
        if: always()
        run: python tools/mfsync.py status --json > mfsync-status.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mfsync-status
          path: mfsync-status.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Job summary
        if: always()
        run: python tools/mfsync.py status | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
