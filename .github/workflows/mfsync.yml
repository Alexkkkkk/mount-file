name: mfsync
# Scheduled checks are read-only. A fresh runner cannot synchronize another
# computer's uncommitted files; local sync/watch must run on that computer.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify = checks; commit = sync; pr = sync through a pull request'
        required: true
        default: verify
        type: choice
        options: [verify, commit, pr]
      message:
        description: 'Optional commit message; passed as data, never as shell code'
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: mfsync-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify (status, secrets, versions, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Sync report
        run: python tools/mfsync.py status
      - name: Secret scan
        run: python tools/mfsync.py scan --all
      - name: Version parity
        run: python tools/mfsync.py check --strict
      - name: Automation regression tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_mfsync.py tests/test_release_version.py tests/test_automation_workflows.py -q
      - name: Machine-readable report
        if: always()
        run: python tools/mfsync.py status --json > mfsync-status.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mfsync-status
          path: mfsync-status.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Job summary
        if: always()
        run: python tools/mfsync.py status | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
  autosync:
    name: Autosync
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      github.event_name == 'workflow_dispatch' && inputs.mode != 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: repository-maintenance-write
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
      MODE: ${{ inputs.mode }}
      MESSAGE: ${{ inputs.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config mfsync.prOnly true
      - name: Sync
        run: |
          set -euo pipefail
          MESSAGE="${MESSAGE:-chore(sync): automated mfsync run}"
          if [ "$MODE" = 'pr' ]; then
            python tools/mfsync.py sync --pr -m "$MESSAGE"
          else
            python tools/mfsync.py sync -m "$MESSAGE"
          fi
      - name: Post-sync report
        if: always()
        run: python tools/mfsync.py status | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
