name: mfsync

# Runs tools/mfsync.py inside CI. Two jobs:
#
#   status   - read-only verification on every push / pull request:
#              sync report, secret scan, version parity, helper self-tests.
#              No credentials beyond contents:read, never writes anything.
#   autosync - actually commits and pushes (or opens a pull request) using
#              the built-in GITHUB_TOKEN. Only reachable by hand
#              (workflow_dispatch) or on the nightly schedule - never by a push
#              - so a CI-generated commit cannot re-trigger the job.
#
# Loop protection is layered: the push trigger never reaches the write job, its
# commits carry [skip ci], a bot actor is skipped, and the concurrency group
# serialises writers so two runs cannot race on the same branch.
#
# The PAT that a developer uses locally is never referenced here: CI uses
# secrets.GITHUB_TOKEN only.

on:
  push:
    branches: [main, 'feat/**', 'sync/**']
  pull_request:
    branches: [main]
  schedule:
    # nightly, 03:17 UTC - off the top of the hour to avoid the runner stampede
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify = checks only | commit = commit + push | pr = commit + pull request'
        type: choice
        options: [verify, commit, pr]
        default: verify
      message:
        description: 'Commit message (empty = generated from the diff)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  status:
    name: Verify (status, secrets, versions, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `git describe --tags` in mfsync check needs the tags

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Sync report
        run: python tools/mfsync.py status

      - name: Secret scan (blocks github_pat_*/ghp_*/AKIA*/xox*/sk-*)
        run: python tools/mfsync.py scan --all

      - name: Version parity (pyproject.toml vs mountfile/__init__.py)
        run: python tools/mfsync.py check --strict

      - name: Helper self-tests
        run: |
          python -m pip install --quiet --upgrade pytest
          python -m pytest tests/test_mfsync.py -q

      - name: Machine-readable report
        if: always()
        run: python tools/mfsync.py status --json > mfsync-status.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mfsync-status
          path: mfsync-status.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: python tools/mfsync.py status | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

  autosync:
    name: Autosync (${{ inputs.mode || 'commit' }})
    needs: status
    # Only the manual and scheduled paths may write; a push can never reach it,
    # and a bot actor is skipped as a second line of defence.
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'verify') ||
      (github.event_name == 'schedule' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit + push to a sync/* branch or the current one
      pull-requests: write # mfsync falls back to a PR when main is protected
    concurrency:
      group: mfsync-write
      cancel-in-progress: false
    env:
      # Read by mfsync at call time; never printed, always redacted.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Sync
        run: |
          set -eu
          MODE="${{ inputs.mode }}"
          MESSAGE="${{ inputs.message }}"
          if [ -z "$MESSAGE" ]; then
            MESSAGE="chore(sync): automated mfsync run [skip ci]"
          else
            MESSAGE="$MESSAGE [skip ci]"
          fi
          echo "mode=${MODE:-commit} message=${MESSAGE}"
          if [ "$MODE" = "pr" ]; then
            python tools/mfsync.py sync --pr -m "$MESSAGE"
          else
            python tools/mfsync.py sync -m "$MESSAGE"
          fi

      - name: Post-sync report
        if: always()
        run: python tools/mfsync.py status | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
