name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      # Версии pinned к rev в .pre-commit-config.yaml — локально и в CI
      # проверяется один и тот же код одним и тем же инструментом.
      - name: Install linters (pinned to pre-commit revs)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.4.10 black==24.4.2 isort==5.13.2
      - name: Static check (syntax + undefined names)
        run: ruff check . --select E9,F63,F7,F82 --output-format=github
      - name: Format check (black)
        run: black --check --diff .
      - name: Import order check (isort)
        run: isort --check-only --diff .
      - name: Byte-compile all sources
        run: python -m compileall -q mountfile main.py tests
      - name: Validate GitHub Actions workflows with a checksum-pinned actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' \
            -o "$ARCHIVE"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$ARCHIVE" | sha256sum --check -
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

  quality-gate:
    needs: [lint]
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require lint and workflow validation to succeed
        env:
          LINT: ${{ needs.lint.result }}
        run: |
          test "$LINT" = 'success'
      - name: Quality gates passed
        run: echo "OK"
