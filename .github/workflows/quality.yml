name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Static check (syntax + undefined names)
        run: |
          python -m pip install --upgrade pip ruff
          ruff check . --select E9,F63,F7,F82 --output-format=github
      - name: Byte-compile all sources
        run: python -m compileall -q mountfile main.py tests
      - name: Validate GitHub Actions workflows with a checksum-pinned actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' \
            -o "$ARCHIVE"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$ARCHIVE" | sha256sum --check -
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt || echo "::warning title=Optional deps::runtime deps (PyQt6/pytsk3) unavailable for Python ${{ matrix.python-version }} - tests run without them"
      - name: Run tests
        run: python -m pytest -q tests

  quality-gate:
    needs: [lint, test]
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any required job failed
        if: ${{ needs.lint.result != 'success' || needs.test.result != 'success' }}
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }}"
          exit 1
      - name: Quality gates passed
        run: echo "OK"
