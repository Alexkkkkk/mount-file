name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Static check (syntax + undefined names)
        run: |
          python -m pip install --upgrade pip ruff
          ruff check . --select E9,F63,F7,F82 --output-format=github
      - name: Byte-compile all sources
        run: python -m compileall -q mountfile main.py tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt || echo "::warning title=Optional deps::runtime deps (PyQt6/pytsk3) unavailable for Python ${{ matrix.python-version }} - tests run without them"
      - name: Run tests
        run: |
          set +e
          python -m pytest -q tests
          code=$?
          if [ $code -eq 5 ]; then echo "::warning title=No tests::pytest collected no tests"; exit 0; fi
          exit $code

  quality-gate:
    needs: [lint, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any required job failed
        if: ${{ needs.lint.result != 'success' || needs.test.result != 'success' }}
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }}"
          exit 1
      - name: Quality gates passed
        run: echo "OK"
