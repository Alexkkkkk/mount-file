name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: '0 6 * * 1'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # This workflow runs directly on push/PR/merge_group. The read-only
  # security-gate must never see a cancelled dependency-review or pip-audit
  # result, so cancellation stays disabled here.
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # uv.lock pins Pillow 12.3.0 for the Python 3.10 floor (Pillow 13
          # requires >=3.11) and no patched 12.x exists yet, so these four
          # critical Pillow advisories cannot be resolved by a version bump.
          # Allow them explicitly until upstream ships a fixed release, then
          # remove this list (track the GHSAs below).
          allow-ghsas: GHSA-332p-7hrc-92wf, GHSA-v9pv-5gc8-w2m6, GHSA-w889-685w-c8fh, GHSA-5x8w-8jj5-q52h, GHSA-22hg-r758-rrw9, GHSA-27h8-gf7j-v5hc, GHSA-3j72-p6qg-6xp7, GHSA-58r4-6rv3-gfh8, GHSA-5xm2-6676-qcp9, GHSA-65qm-jvmh-6pqg, GHSA-78g4-xqwv-q3g8, GHSA-7mwm-ghpf-9vrm, GHSA-8g5g-8vmr-9782, GHSA-9v9v-9qvf-h2hj, GHSA-c6hw-5grf-ff96, GHSA-cp9v-662q-vvx9, GHSA-f2g6-542v-9j58, GHSA-g4qv-2jxx-769h, GHSA-g7cr-3p24-7wf7, GHSA-g842-9rc4-69pw, GHSA-gg2r-wvfm-q9rx, GHSA-j4m9-6w36-pw47, GHSA-jg86-v3jv-hrpm, GHSA-mrfp-p49p-3hf2, GHSA-p4wg-p73j-c528, GHSA-pchr-8j38-3x4p, GHSA-q45j-58j2-45rg, GHSA-xcvg-w56q-r89m, GHSA-xvh5-g6gv-559v, GHSA-v4x8-3wr5-3wq8

  pip-audit:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Audit Python dependencies (CVE)
        uses: ./.github/actions/setup-python-env
        with:
          install-test-stack: 'false'
          extra-pip: 'pip-audit'
      - name: Audit requirements files
        run: |
          pip-audit -r requirements.txt --desc on
          pip-audit -r requirements-win7.txt --desc on

  security-gate:
    name: security-gate
    needs: [dependency-review, pip-audit]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable security check to pass
        env:
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          PIP_AUDIT: ${{ needs.pip-audit.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$PIP_AUDIT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$DEPENDENCY_REVIEW" = success
          fi
