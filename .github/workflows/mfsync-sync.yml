name: mfsync-manual-sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'commit = synchronize branch; pr = synchronize through a pull request'
        required: true
        default: pr
        type: choice
        options: [commit, pr]
      message:
        description: 'Optional commit message; passed as data, never as shell code'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: repository-maintenance-write
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before repository sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify repository status and secrets
        run: |
          python tools/mfsync.py status
          python tools/mfsync.py scan --all
          python tools/mfsync.py check --strict
      - name: Run automation regression tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_mfsync.py tests/test_release_version.py tests/test_automation_workflows.py -q
  autosync:
    name: Manual repository sync
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
      MODE: ${{ inputs.mode }}
      MESSAGE: ${{ inputs.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config mfsync.prOnly true
      - name: Sync
        run: |
          set -euo pipefail
          MESSAGE="${MESSAGE:-chore(sync): automated mfsync run}"
          if [ "$MODE" = 'pr' ]; then
            python tools/mfsync.py sync --pr -m "$MESSAGE"
          else
            python tools/mfsync.py sync -m "$MESSAGE"
          fi
      - name: Post-sync report
        if: always()
        run: python tools/mfsync.py status | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
