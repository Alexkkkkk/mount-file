name: pipeline

# Single entry point for the verification pipeline. Calls the existing
# quality / security / mfsync / CI workflows as reusable workflows and
# exposes exactly one aggregate status check: Pipeline-Gate.
#
# Runs once per main push. It deliberately does NOT trigger on pull_request:
# the four called workflows already trigger directly on pull requests, so a
# pull_request trigger here executed the entire suite (matrix + integration +
# Windows legs) a SECOND time for every PR - ~20 extra runner-minutes per PR
# that could never change the PR's verdict. Branch protection requires the
# direct, unprefixed contexts (test (3.10), Integration (...), ...), so PRs are
# gated by those alone; main additionally gets the single aggregate
# Pipeline-Gate as a post-merge alarm.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  security:
    # dependency-review comments on the PR, so the caller must allow
    # pull-requests: write; the called workflow stays read-only on contents.
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: write

  mfsync:
    uses: ./.github/workflows/mfsync.yml
    permissions:
      contents: read

  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  pipeline-gate:
    name: Pipeline-Gate
    needs: [quality, security, mfsync, ci]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QUALITY: ${{ needs.quality.result }}
      SECURITY: ${{ needs.security.result }}
      MFSYNC: ${{ needs.mfsync.result }}
      CI: ${{ needs.ci.result }}
    steps:
      - name: Require every pipeline stage to succeed
        run: |
          set -euo pipefail
          fail=0
          for stage in "$QUALITY" "$SECURITY" "$MFSYNC" "$CI"; do
            if [ "$stage" != 'success' ]; then
              echo "::error::A pipeline stage ended with $stage"
              fail=1
            fi
          done
          exit "$fail"
