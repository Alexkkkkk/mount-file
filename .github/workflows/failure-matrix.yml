name: Writer Failure Matrix

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: failure-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  failure-matrix:
    name: Failure injection + process-kill matrix (#387, #530 P2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install filesystem tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dosfstools exfatprogs e2fsprogs ntfs-3g
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # tests/conftest.py imports FileLock at collection time; this workflow
          # installs a focused test stack instead of the project's dev extra.
          python -m pip install pytest pytest-timeout hypothesis 'filelock>=4.3'
      - name: Run failure-injection and process-kill matrix
        run: |
          python -m pytest \
            tests/test_fat1216_writer.py \
            tests/test_native_writer_failure_matrix.py \
            tests/test_ext2_native.py::test_native_ext2_staging_failure_does_not_modify_original \
            tests/test_ext2_native.py::test_native_ext2_rolls_back_and_verifies_restored_extent_hash \
            tests/test_ext2_native.py::test_native_ext2_short_rollback_write_is_not_claimed_as_restored \
            tests/test_ext2_native.py::test_native_ext2_recovers_after_process_dies_mid_commit \
            tests/test_ext2_native.py::test_native_ext2_rolls_back_commit_if_process_dies_before_marker_cleanup \
            tests/test_ext2_native.py::test_native_ext2_cleanup_failure_after_commit_does_not_roll_back \
            tests/test_ext2_native.py::test_native_ext2_refuses_to_overwrite_unknown_commit_bytes \
            tests/test_ext2_native.py::test_native_ext2_rejects_concurrent_change_before_commit \
            tests/test_ntfs_writer_fault_coverage.py \
            tests/test_ext4_writer_fault_coverage.py \
            tests/test_ext4_write_phase_injection.py \
            tests/test_ntfs_native_write_phase_injection.py \
            tests/test_ntfs_write_phase_injection.py \
            tests/test_ntfs_mft_allocation.py \
            tests/test_ntfs_mft_wiring.py \
            tests/test_native_operation_matrix.py \
            tests/test_writer_fault_injection_acceptance.py \
            tests/test_ntfs_crash_oracle_matrix.py \
            tests/test_ntfs_replay.py \
            tests/test_ntfs_replay_executor.py \
            tests/test_jbd2_checkpoint_interruption.py \
            -q --junitxml=failure-matrix.xml
      - name: Emit test, checker and acceptance evidence separately
        if: always()
        run: >-
          python scripts/failure_matrix_artifact.py
          --repo-root .
          --junitxml failure-matrix.xml
          --json-out failure-matrix.json
      - name: Validate generated matrix against JUnit
        if: always()
        run: >-
          python scripts/failure_matrix_artifact.py
          --repo-root .
          --junitxml failure-matrix.xml
          --validate failure-matrix.json
          --json-out failure-matrix-validation.json
      - name: Regenerate status artifacts
        if: always()
        run: python scripts/sync_repository_status.py --repo-root . --output-dir docs/generated
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: failure-matrix-${{ github.sha }}
          path: |
            failure-matrix.xml
            failure-matrix.json
            failure-matrix-validation.json
            docs/generated/
          if-no-files-found: ignore
          retention-days: 14
