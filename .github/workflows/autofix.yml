name: autofix
# Formatting only: no UP/F401 rewrites that can break Python 3.8 or reexports.
# Runs on main when enabled, or explicitly from Actions / ChatOps.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: repository-maintenance-write
  cancel-in-progress: false
jobs:
  autofix:
    if: >-
      github.ref == 'refs/heads/main' &&
      (vars.ENABLE_AUTOFIX == 'true' || github.event_name == 'workflow_dispatch') &&
      !startsWith(github.event.head_commit.message || '', 'chore: autofix')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install reproducible formatters and test dependencies
        run: |
          python -m pip install 'ruff==0.4.10' 'black==24.4.2' 'isort==5.13.2' pytest \
            'fastapi>=0.115,<1' 'uvicorn>=0.30,<1' 'httpx>=0.27,<1'
      - name: Format imports then code without semantic rewrites
        run: |
          isort --profile black --line-length 100 mountfile tests main.py
          black --line-length 100 --target-version py38 mountfile tests main.py
          isort --profile black --line-length 100 --check-only mountfile tests main.py
          black --line-length 100 --target-version py38 --check mountfile tests main.py
      - name: Require syntax, secret and regression checks before publishing fixes
        run: |
          ruff check mountfile tests main.py --select E9,F63,F7,F82
          python -m compileall -q mountfile tests main.py
          python tools/mfsync.py scan --all
          python -m pytest tests/ -q
      - name: Open or reuse a reviewed formatting PR
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          BRANCH="autofix/$(git rev-parse --short=12 HEAD)"
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git switch -c "$BRANCH"
            git add mountfile tests main.py
            git commit -m 'chore: autofix (formatting only)'
            git push -u origin "$BRANCH"
          fi
          EXISTING=$(gh pr list --head "$BRANCH" --base main --state all --json number --jq 'length')
          if [ "$EXISTING" = '0' ]; then
            gh pr create --base main --head "$BRANCH" \
              --label auto-merge \
              --title 'chore: autofix (formatting only)' \
              --body 'Reproducible isort/black formatting, with syntax and full regression checks before publication. Auto-merge is enabled only after all required quality, security and sync gates pass for this exact commit.'
          fi
