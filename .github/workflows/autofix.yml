name: autofix

# ruff / black / isort fix the code after every push to main and open a
# PULL REQUEST labeled "auto-merge" instead of pushing to main directly.
# A direct push failed before with:
#   "GH013: Repository rule violations - Changes must be made through a
#    pull request" (the protect-main ruleset).
# The PR is created with AUTOMATION_TOKEN so that CI, CodeQL, Security
# and Quality actually run on it (GITHUB_TOKEN-created PRs stay silent).
# auto-merge then waits for the checks and squash-merges it.
#
# Loop protection: the merge commit message contains "autofix" and the
# job refuses to run on such commits. The workflow is opt-in because the
# formatter's collections.abc rewrite is not Python 3.8-compatible.
# Enable it only after validating the formatter configuration with the
# repository variable ENABLE_AUTOFIX=true.

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    if: >-
      ${{ vars.ENABLE_AUTOFIX == 'true' &&
          !startsWith(github.event.head_commit.message || '', 'chore: autofix') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install fixers
        run: pip install ruff black isort

      - name: "ruff --fix (F401 unused imports, F821 undefined names, ...)"
        run: ruff check --fix mountfile tests main.py || true

      - name: black (formatting)
        run: black --quiet mountfile tests main.py || true

      - name: isort (import order)
        run: isort --quiet mountfile tests main.py || true

      - name: Verify the code still compiles
        run: python -m compileall -q mountfile main.py

      - name: Open a pull request with the fixes
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No automatic fixes needed."
            exit 0
          fi
          gh label create auto-merge --force \
            --description "Merged automatically once CI is green" --color 0e8a16 >/dev/null 2>&1 || true
          BRANCH="autofix/${GITHUB_SHA::8}"
          git checkout -b "$BRANCH"
          git commit -m "chore: autofix (ruff/black/isort)"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: autofix (ruff/black/isort)" \
            --label auto-merge \
            --head "$BRANCH" \
            --body "Automatic fixes produced by the \`autofix\` workflow.
          - ruff: unused imports / undefined names
          - black + isort: formatting and import order

          Merging is handled by the \`auto-merge\` workflow once CI is green."
          echo "opened the autofix PR from $BRANCH"
