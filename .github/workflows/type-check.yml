name: Type Check (advisory)

# mypy как advisory-гейт: не блокирует merge, но показывает тренд типизации.
# Перевод в блокирующий режим — после зануления текущего долга по аннотациям.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip mypy
      - run: python -m pip install -r requirements.txt || true
      - name: mypy (advisory)
        run: python -m mypy mountfile --ignore-missing-imports --no-error-summary --show-error-line || true
