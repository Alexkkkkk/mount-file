# .github/workflows/auto-release.yml
#
# Zero-touch release: python-semantic-release вычисляет версию из
# conventional commits, создаёт тег vX.Y.Z и GitHub Release, после чего
# matrix-сборка PyInstaller прикрепляет бинарники к этому же релизу.
#
# Ожидается, что файл лежит в .github/workflows/ и в репозитории есть
# pyproject.toml с секцией [tool.semantic_release] (см. этот же коммит).
name: Auto Release (Zero-Touch)

on:
  push:
    branches: [main]
  workflow_dispatch: {} # ручной запуск

permissions:
  contents: write
  packages: write

# Один релиз за раз: два одновременных прогона semantic-release
# подрались бы за один и тот же тег.
concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # JOB 1: Semantic Release — авто-версия и создание тега
  # ============================================================
  release:
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужно для анализа всей истории коммитов
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python-semantic-release
        run: |
          python -m pip install --upgrade pip
          pip install "python-semantic-release~=9.0"

      # Раньше здесь генерировался pyproject.toml через heredoc внутри
      # if-блока: терминатор EOF был с отступом, из-за чего sh падал с
      # "unexpected end of file", а версия файла была невалидна для v9
      # (version_variable / branch вместо version_variables / branches).
      # Теперь конфиг лежит в репозитории, а шаг только проверяет его.
      - name: Validate semantic-release config
        run: |
          if [ ! -f pyproject.toml ]; then
            echo "::error::pyproject.toml не найден — semantic-release не сможет определить конфигурацию"
            exit 1
          fi
          python -c "import tomllib,pathlib;c=tomllib.loads(pathlib.Path('pyproject.toml').read_text('utf-8'));print('semantic_release:', c['tool']['semantic_release'])"

      - name: Semantic Release
        id: semantic
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # root_options: "--noop"  # для тестового прогона

  # ============================================================
  # JOB 2: Multi-Platform Build — сборка бинарников
  # ============================================================
  build:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 7 (Python 3.8 + PyQt5)
          - os: windows-latest
            python: '3.8'
            qt: 'PyQt5'
            req: 'requirements-win7.txt'
            artifact: mount-file-windows7
            asset: dist/mount-file-windows7.exe
          # Windows 10/11 (Python 3.12 + PyQt6)
          - os: windows-latest
            python: '3.12'
            qt: 'PyQt6'
            req: 'requirements.txt'
            artifact: mount-file-windows
            asset: dist/mount-file-windows.exe
          # Linux
          - os: ubuntu-latest
            python: '3.12'
            qt: 'PyQt6'
            req: 'requirements.txt'
            artifact: mount-file-linux
            asset: dist/mount-file-linux
          # macOS
          - os: macos-latest
            python: '3.12'
            qt: 'PyQt6'
            req: 'requirements.txt'
            artifact: mount-file-macos
            asset: dist/mount-file-macos

    steps:
      # Тег релиза — это vX.Y.Z, а output semantic-release отдаёт X.Y.Z
      # без префикса, поэтому здесь обязательна буква v.
      - name: Checkout (по тегу релиза)
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: ${{ matrix.req }}

      # Запекаем версию тега в mountfile/__init__.py: без этого exe
      # сообщал старую версию и предлагал сам себе обновление.
      - name: Stamp version from tag
        shell: bash
        run: python scripts/stamp_version.py "v${{ needs.release.outputs.new_release_version }}"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # requirements-win7.txt уже содержит PyQt5 и pyinstaller и
          # помечает pytsk3 маркером python_version >= "3.10" — на
          # Python 3.8 под Windows колёс pytsk3 нет, сборка sdist
          # падала бы без MSVC.
          pip install -r ${{ matrix.req }}
          pip install ${{ matrix.qt }} pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          # Иконка приложения берётся из mountfile/data через mountfile.appicon:
          # .ico для Windows, .icns для macOS, .png для Linux.
          ICON="$(python -m mountfile.appicon || true)"
          ICON_FLAG=()
          if [ -n "$ICON" ] && [ -f "$ICON" ]; then ICON_FLAG=(--icon "$ICON"); fi
          if [ -f "mount-file.spec" ]; then
            pyinstaller mount-file.spec --noconfirm
          else
            pyinstaller --onefile --name ${{ matrix.artifact }} \
              "${ICON_FLAG[@]}" \
              --add-data "mountfile/data/icon.png:mountfile/data" \
              main.py
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.new_release_version }}
          files: ${{ matrix.asset }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
