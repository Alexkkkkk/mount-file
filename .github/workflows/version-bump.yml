name: version-bump

# Automatic semantic versioning from conventional commits:
#   feat:         -> minor
#   fix: / perf:  -> patch
#   any type!:    -> major (breaking change)
# minor is evaluated before patch, so a fix in the same release cannot
# downgrade a feat.
#
# The tag is pushed with the workflow's own GITHUB_TOKEN (which the tag
# ruleset allows - only branches are protected). A tag pushed with
# GITHUB_TOKEN does not fire other workflows by itself, therefore the
# next stage is started explicitly with `gh workflow run`
# (workflow_dispatch IS allowed to be triggered by GITHUB_TOKEN - it is
# the documented exception to the recursion rule).

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release)') &&
      !startsWith(github.event.head_commit.message, 'chore: autofix') &&
      !contains(github.event.head_commit.message, '[skip version]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute the next version
        id: ver
        run: |
          set -euo pipefail
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "HEAD is already tagged, nothing to do."
            exit 0
          fi
          LAST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LAST" ]; then
            echo "next=v0.1.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "last tag: $LAST"
          LOG=$(git log "$LAST..HEAD" --no-merges --pretty=format:'%s')
          echo "commits since $LAST:"; echo "$LOG"
          BUMP=none
          if echo "$LOG" | grep -qE '^[a-z]+(\([^)]*\))?!:';        then BUMP=major
          elif echo "$LOG" | grep -qE '^feat(\([^)]*\))?:';        then BUMP=minor
          elif echo "$LOG" | grep -qE '^(fix|perf)(\([^)]*\))?:';  then BUMP=patch
          fi
          echo "bump: $BUMP"
          if [ "$BUMP" = "none" ]; then exit 0; fi
          MAJ=$(echo "$LAST" | sed -E 's/^v([0-9]+).*/\1/')
          MIN=$(echo "$LAST" | sed -E 's/^v[0-9]+\.([0-9]+).*/\1/')
          PAT=$(echo "$LAST" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+).*/\1/')
          case "$BUMP" in
            major) MAJ=$((MAJ + 1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN + 1)); PAT=0 ;;
            patch) PAT=$((PAT + 1)) ;;
          esac
          echo "next=v$MAJ.$MIN.$PAT" >> "$GITHUB_OUTPUT"

      - name: Push the tag
        if: steps.ver.outputs.next != ''
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.ver.outputs.next }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "tag $TAG already exists on the remote, skipping."
            exit 0
          fi
          git tag -a "$TAG" -m "release $TAG"
          git push origin "$TAG"
          echo "pushed $TAG"

      - name: Start the release stage
        if: steps.ver.outputs.next != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run create-release.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            -f tag="${{ steps.ver.outputs.next }}"
          echo "dispatched create-release for ${{ steps.ver.outputs.next }}"
