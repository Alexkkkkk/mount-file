name: version-bump
# Tag only a tested main commit, with matching package/build versions.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      patch:
        description: 'Request a patch release even without a feat/fix commit'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: repository-maintenance-write
  cancel-in-progress: false
jobs:
  ensure-main-ci:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'automation/release-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Reuse push CI, or dispatch a GITHUB_TOKEN fallback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            PUSH_RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$MERGED_SHA" --limit 20 --json event \
              --jq '[.[] | select(.event == "push")] | length')
            if [ "$PUSH_RUNS" -gt 0 ]; then
              echo "push CI already exists for $MERGED_SHA; no duplicate dispatch."
              exit 0
            fi
            sleep 10
          done
          echo '::notice::No push CI appeared; dispatching the GITHUB_TOKEN fallback.'
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
  bump:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REQUEST_PATCH: ${{ inputs.patch || false }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Never execute a PR/fork checkout in a privileged workflow_run.
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Verify latest main SHA has successful CI
        id: eligible
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          if [ "$SHA" != "$TESTED_SHA" ]; then
            echo 'Newer main commit exists; its CI owns the release.'
            exit 0
          fi
          STATE=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI-Gate" and .app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion')
          if [ "$STATE" != 'success' ]; then
            echo 'CI-Gate has not passed; refusing to release.'
            exit 0
          fi
          echo 'proceed=true' >> "$GITHUB_OUTPUT"
      - name: Plan release
        if: steps.eligible.outputs.proceed == 'true'
        id: plan
        run: |
          set -euo pipefail
          FLAGS=()
          if [ "$REQUEST_PATCH" = 'true' ]; then FLAGS+=(--patch); fi
          python scripts/release_plan.py --json "${FLAGS[@]}" > "$RUNNER_TEMP/release-plan.json"
          cat "$RUNNER_TEMP/release-plan.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-plan.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('tag', 'version', 'needs_version_pr', 'has_release_change'):
                  value = plan[key]
                  if isinstance(value, bool):
                      value = str(value).lower()
                  output.write(f'{key}={value}\n')
          PY
      - name: Update source versions through a pull request
        if: steps.plan.outputs.has_release_change == 'true' && steps.plan.outputs.needs_version_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          BRANCH="automation/release-$VERSION"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Release branch $BRANCH exists; leaving it unchanged."
          else
            python scripts/stamp_version.py "$TAG"
            python tools/mfsync.py check --strict
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git switch -c "$BRANCH"
            git add mountfile/__init__.py pyproject.toml
            git commit -m "chore(release): synchronize $VERSION"
            # Token comes from the runner environment, never from a URL.
            git -c http.https://github.com/.extraheader= -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push -u origin "$BRANCH"
          fi
          EXISTING=$(gh pr list --head "$BRANCH" --base main --state all --json number --jq 'length')
          if [ "$EXISTING" = '0' ]; then
            gh pr create --base main --head "$BRANCH" \
              --label auto-merge \
              --title "chore(release): synchronize $VERSION" \
              --body 'Updates package and build metadata together. Auto-merge is enabled only after required CI, security and sync gates pass for this exact commit. Merge triggers a fresh full CI run on protected main, then tags that tested commit and starts release builds.'
          fi
      - name: Tag tested commit and start release
        if: steps.plan.outputs.has_release_change == 'true' && steps.plan.outputs.needs_version_pr == 'false'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          python scripts/stamp_version.py "$TAG" --check
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists; never overwriting it."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          REMOTE_SHA=$(git ls-remote --heads origin main | cut -f1)
          if [ "$REMOTE_SHA" != "$TESTED_SHA" ]; then
            echo 'Main advanced while planning; its next CI owns the release.'
            exit 0
          fi
          git tag -a "$TAG" -m "release $TAG"
          git push origin "$TAG"
          gh workflow run create-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
