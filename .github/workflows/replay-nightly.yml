name: Replay Nightly Evidence

# #510 D2/D6 + #387: the remaining gap was never "the matrix fails in a PR" --
# it is that the failure-injection / process-kill matrix has no *scheduled*
# history and that the acceptance criterion "two consecutive nightly runs" was
# asserted in prose only.  This workflow runs the matrix on a nightly schedule,
# publishes the JUnit-backed evidence artifact, and then queries GitHub Actions
# for the current streak of consecutive successful scheduled runs.
#
# It never promotes a checklist item: `scripts/replay_nightly_evidence.py`
# always emits `acceptance: not_claimed` and reports `unavailable` (never
# `satisfied`) when the API or the token is missing.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: replay-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay-nightly:
    name: Scheduled replay failure / process-kill matrix (#387, #510 D2/D6)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install filesystem tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dosfstools exfatprogs e2fsprogs ntfs-3g
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-timeout hypothesis
      - name: Run the replay failure-injection and process-kill matrix
        run: |
          python -m pytest \
            tests/test_native_writer_failure_matrix.py \
            tests/test_ext4_writer_fault_coverage.py \
            tests/test_ntfs_writer_fault_coverage.py \
            tests/test_ntfs_crash_oracle_matrix.py \
            tests/test_ntfs_replay.py \
            tests/test_jbd2_checkpoint_interruption.py \
            tests/test_native_journal_writers.py \
            tests/test_fat1216_writer.py \
            -q --junitxml=replay-nightly.xml
      - name: Emit test, checker and acceptance evidence separately
        if: always()
        run: >-
          python scripts/failure_matrix_artifact.py
          --repo-root .
          --junitxml replay-nightly.xml
          --json-out replay-nightly-matrix.json
      - name: Validate generated matrix against JUnit
        if: always()
        run: >-
          python scripts/failure_matrix_artifact.py
          --repo-root .
          --junitxml replay-nightly.xml
          --validate replay-nightly-matrix.json
          --json-out replay-nightly-validation.json
      - name: Query consecutive scheduled-run evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/replay_nightly_evidence.py \
            --repo "${{ github.repository }}" \
            --workflow replay-nightly.yml \
            --required 2 \
            --json-out replay-nightly-streak.json
      - name: Regenerate status artifacts
        if: always()
        run: python scripts/sync_repository_status.py --repo-root . --output-dir docs/generated
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: replay-nightly-${{ github.sha }}
          path: |
            replay-nightly.xml
            replay-nightly-matrix.json
            replay-nightly-validation.json
            replay-nightly-streak.json
            docs/generated/
          if-no-files-found: ignore
          retention-days: 90
