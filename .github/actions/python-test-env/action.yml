name: Python test environment
description: >-
  Single source of truth for the Python test stack (pytest, hypothesis, Qt
  runtime bindings and the API dependencies). Before this action existed, every
  workflow duplicated the same pip command line and they silently drifted
  apart: ci.yml installed hypothesis while release.yml did not, so the release
  pipeline failed with "ModuleNotFoundError: No module named 'hypothesis'".
  Installs with uv instead of pip: dependency resolution drops from ~70s to
  ~20s per job. Pass python-version to pin an interpreter, or leave it empty
  to reuse the interpreter an earlier actions/setup-python step provisioned
  (ci.yml does this for the version matrix).
inputs:
  python-version:
    description: 'Python version to provision. Empty = reuse the current interpreter.'
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      if: inputs.python-version != ''
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Install uv (Rust package manager, GHA-cached)
      uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          requirements*.txt

    - name: Install the pinned test stack
      shell: bash
      run: |
        set -euo pipefail
        uv pip install --system pytest pytest-cov pytest-timeout hypothesis setuptools wheel 'PyQt6>=6.11.0'
        uv pip install --system 'fastapi>=0.115,<1.0' 'uvicorn>=0.30,<1.0' 'httpx>=0.27,<1.0' 'regex>=2024.0.0' 'pydantic>=2.0'
