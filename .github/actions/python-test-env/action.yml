name: Python test environment
description: >-
  Single source of truth for the Python test stack. Installs the environment
  from the committed uv.lock with `uv sync --frozen`, so CI never runs a
  resolver: every version is the exact one recorded in the lockfile, and the
  install is a cache restore plus a wheel unpack. Before the lockfile existed,
  each job re-resolved PyQt6/fastapi/hypothesis from scratch (~60-90 s) and two
  jobs could legitimately get different versions on the same commit.
inputs:
  python-version:
    description: 'Python version to provision. Empty = reuse the current interpreter.'
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      if: inputs.python-version != ''
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv (Rust package manager, GHA-cached)
      uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    # --frozen: fail instead of silently re-locking when pyproject.toml and
    # uv.lock disagree. --extra ci is the exact test stack (pytest, cov,
    # timeout, xdist, hypothesis, PyQt6, API deps).
    - name: Install the locked test environment
      shell: bash
      run: |
        set -euo pipefail
        # --python pins the interpreter actions/setup-python provisioned, so
        # the lockfile resolves against the exact version under test instead
        # of whatever CPython uv finds first on the runner.
        PY_BIN="$(command -v python)"
        if [ "$RUNNER_OS" = "Windows" ]; then
          # Git Bash resolves python.exe without the .exe suffix; uv requires
          # the exact file name when given an explicit --python path.
          case "$PY_BIN" in
            *.exe) : ;;
            *) PY_BIN="$PY_BIN.exe" ;;
          esac
          PY_BIN="$(cygpath -m "$PY_BIN")"
        fi
        uv sync --frozen --extra ci --python "$PY_BIN"

    # uv's venv ships without pip on purpose. One ci.yml step runs
    # `python -m pip wheel`, so pip is installed explicitly instead of
    # pulling the whole world into the venv.
    - name: Ensure pip inside the locked venv
      shell: bash
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = "Windows" ]; then
          VENV_PY="$PWD/.venv/Scripts/python.exe"
        else
          VENV_PY="$PWD/.venv/bin/python"
        fi
        uv pip install --python "$VENV_PY" pip

    # Put the locked interpreter first on PATH so the existing
    # `python -m pytest` / `python main.py` commands keep working unchanged.
    - name: Put the locked venv on PATH
      shell: bash
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
        else
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        fi
