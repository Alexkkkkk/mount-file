name: 'Setup system dependencies (Debian/Ubuntu)'
description: >-
  Single source of truth for the Linux system packages used by the CI matrix.
  Installs the canonical list from tools/system-packages-debian.txt (filesystem
  oracle tools, Qt runtime libraries, build toolchain) plus optional extras,
  so every workflow exercises the same package set.
inputs:
  extra:
    description: 'Space-separated extra apt packages installed on top of the canonical list'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install the canonical system package set
      shell: bash
      env:
        EXTRA: ${{ inputs.extra }}
      run: |
        set -euo pipefail
        sudo apt-get update
        xargs -r sudo apt-get install -y < <(grep -vE '^[[:space:]]*(#|$)' tools/system-packages-debian.txt)
        if [ -n "$EXTRA" ]; then
          # shellcheck disable=SC2086
          sudo apt-get install -y $EXTRA
        fi
