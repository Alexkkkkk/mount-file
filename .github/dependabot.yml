version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, automation]
    groups:
      runtime:
        patterns: ["PyQt*", "pytsk3"]
      tooling:
        patterns: ["pyinstaller", "pytest*", "black", "isort", "ruff"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies, automation]
  # uv.lock is what the Dependabot alerts are raised against (all 60 open
  # alerts point at uv.lock), so security updates must target the uv ecosystem
  # explicitly: the `pip` entry above only rewrites requirements*.txt pins.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: daily
      time: "04:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 10
    labels: [dependencies, security]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
