site_name: Mount File
site_description: Работа с raw-образами дисков и дампами NAND/eMMC
repo_name: Alexkkkkk/mount-file
repo_url: https://github.com/Alexkkkkk/mount-file

# This is the source configuration for local/docs-as-code builds. Deployment is
# intentionally not configured here.
docs_dir: docs

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Тёмная тема

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Обзор: index.md
  - Установка: install.md
  - CLI: cli.md
  - GUI: gui.md
  - AI: ai.md
  - DFIR: dfir.md
