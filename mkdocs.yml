site_name: Mount File
site_description: Работа с raw-образами дисков и дампами NAND/eMMC
repo_name: Alexkkkkk/mount-file
repo_url: https://github.com/Alexkkkkk/mount-file
site_url: https://alexkkkkk.github.io/mount-file/
docs_dir: docs

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Тёмная тема

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Обзор: index.md
  - Установка: install.md
  - CLI: cli.md
  - GUI: gui.md
  - AI: ai.md
  - DFIR: dfir.md
  - Движок записи (MF-WE): write_engine.md
  - API: api.md
  - Demos: demos.md
  - Поддержка проекта: donations.md
  - Синхронизация кода: sync.md
  - Разработчикам:
      - Структура репозитория: structure.md
      - UniversalFSRW snippet: tc_window_universal_fs_rw_snippet.md
      - VFS benchmarks: benchmarks.md
